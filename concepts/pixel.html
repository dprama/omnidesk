<title>OmniDesk · Pixel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
@import url('https://fonts.googleapis.com/css2?family=Silkscreen&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');
:root{
  color-scheme:dark;
  --ink0:#080b16; --ink1:#0f1324; --ink2:#161b31; --ink3:#232a47; --ink4:#363f63;
  --mute:#8790b2; --text:#d6daea; --hi:#f1ede0; --moon:#d8cca6;
  --cyan:#5fc6d6; --violet:#a493f0; --amber:#e6b25c; --teal:#5ccaa0; --rose:#e58aa2; --blue:#6f9ff0;
  --good:#8bd27a; --warn:#e3a25a; --bad:#e06c6c;
  --panel:rgba(14,18,34,.93); --panel2:rgba(20,25,46,.95);
  --px:"Silkscreen","Courier New",ui-monospace,monospace;
  --sans:"IBM Plex Sans","Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --acc:var(--blue); --bc:var(--ink4); --sb:236px;
  --gl:max(16px, env(safe-area-inset-left, 0px)); --gr:max(16px, env(safe-area-inset-right, 0px));
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ink0);color:var(--text);font:400 15px/1.55 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
[hidden]{display:none!important}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--hi);outline-offset:4px}
h1,h2,h3{margin:0;font-weight:400}
p{margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
canvas.px{image-rendering:crisp-edges;image-rendering:pixelated;display:block}
.ic{width:16px;height:16px;flex:none;display:inline-block;vertical-align:-3px}

/* pixel border: stepped corners via 4-way hard shadows */
.pnl,.phead,.card,.btn,.seg>button,.sw,.pill,.field,.cmd-panel,.toast,.tile,.code-d,.rule,.st-cmd,.navcmd,.ibtn,.chk,.logbox,.item,.devrow,.dir{
  box-shadow:0 -2px 0 0 var(--bc),0 2px 0 0 var(--bc),-2px 0 0 0 var(--bc),2px 0 0 0 var(--bc);
}

#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;image-rendering:crisp-edges;image-rendering:pixelated}

/* shell */
.app{position:relative;z-index:1;display:grid;grid-template-columns:var(--sb) minmax(0,1fr);gap:28px;min-height:100vh;padding-left:var(--gl);padding-right:var(--gr)}
.side{position:sticky;top:0;height:100vh;overflow:auto;padding:22px 4px 70px 4px;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:10px;font:16px/1 var(--px);color:var(--hi);letter-spacing:.5px}
.brand svg{width:33px;height:21px}
.navcmd{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;background:var(--ink0);border:0;cursor:pointer;color:var(--mute);font-size:14px;--bc:var(--ink3);text-align:left}
.navcmd:hover{--bc:var(--ink4);color:var(--text)}
.navcmd kbd{margin-left:auto}
kbd{font:500 12px/1 var(--mono);color:var(--text);background:var(--ink3);padding:3px 6px;box-shadow:0 2px 0 var(--ink0)}
.ngroup{display:flex;flex-direction:column;gap:2px}
.nlabel{font:16px/1 var(--px);color:var(--mute);opacity:.75;padding:6px 10px 6px;letter-spacing:.5px}
.nav a{display:flex;align-items:center;gap:11px;padding:8px 10px;color:var(--text);text-decoration:none;font-size:14.5px;position:relative}
.nav a .ic{color:var(--c,var(--mute))}
.nav a:hover{background:rgba(54,63,99,.35)}
.nav a[aria-current="page"]{background:var(--ink2);color:var(--hi);box-shadow:0 -2px 0 0 var(--ink3),0 2px 0 0 var(--ink3),-2px 0 0 0 var(--ink3),2px 0 0 0 var(--ink3)}
.nav a[aria-current="page"]::before{content:"";position:absolute;left:-2px;top:6px;bottom:6px;width:4px;background:var(--c)}
.nav a .nst{margin-left:auto;width:6px;height:6px;background:var(--ink4)}
.nav a .nst.on{background:var(--c)}
main{min-width:0;padding:26px 2px 110px;outline:none}
.topbar{display:none}

/* headers */
.phead{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,480px);gap:24px;align-items:center;padding:22px;background:var(--panel);margin:2px 2px 28px;--bc:var(--ink4)}
.kicker{display:flex;align-items:center;gap:8px;font:16px/1 var(--px);color:var(--acc);letter-spacing:.5px}
.phead h1{font:32px/1.1 var(--px);color:var(--hi);margin:12px 0 10px;letter-spacing:.5px;outline:none}
.lede{color:var(--mute);max-width:46ch}
.live{display:flex;flex-wrap:wrap;gap:10px 12px;margin-top:16px}
.pill{display:inline-flex;align-items:center;gap:7px;padding:4px 10px;background:var(--ink0);font-size:13px;--bc:var(--ink3);margin:2px}
.pill b,.num{font-weight:600;color:var(--hi);font-variant-numeric:tabular-nums}
.dot{width:8px;height:8px;display:inline-block;background:var(--mute);flex:none}
.dot.good{background:var(--good)}.dot.bad{background:var(--bad)}.dot.warn{background:var(--warn)}.dot.acc{background:var(--acc)}
.ph-scene{background:#0a0e1d;box-shadow:inset 0 0 0 2px var(--ink3);padding:2px}
.ph-scene canvas{width:100%;height:auto}

/* panels */
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;margin-bottom:24px}
.stack{display:flex;flex-direction:column;gap:24px}
.pnl{background:var(--panel);padding:20px;min-width:0;margin:2px}
.pnl h2{display:flex;align-items:center;gap:10px;font:16px/1.2 var(--px);color:var(--hi);margin-bottom:14px;letter-spacing:.5px}
.pnl h2::before{content:"";width:8px;height:8px;background:var(--acc);flex:none}
.pnl h2 .badge{margin-left:auto}
.pnl > p,.note{color:var(--mute);font-size:14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0;background:linear-gradient(90deg,var(--ink3) 50%,transparent 0) top left/4px 2px repeat-x}
.row:first-of-type{background:none;padding-top:4px}
.row .rl{min-width:0}
.row .rl b{display:block;color:var(--hi);font-weight:500}
.row .rl span{display:block;color:var(--mute);font-size:13.5px}
.badge{font:16px/1 var(--px);font-size:16px;padding:3px 8px;background:color-mix(in srgb,var(--acc) 22%,var(--ink0));color:var(--acc);letter-spacing:.5px}
.badge.sm{font:500 12px/1 var(--sans);padding:4px 7px;letter-spacing:0}
.meta{color:var(--mute);font-size:13.5px}
.btns{display:flex;flex-wrap:wrap;gap:12px;margin-top:14px}

/* buttons & controls */
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;background:var(--ink3);color:var(--hi);border:0;cursor:pointer;font-weight:600;font-size:14px;--bc:var(--ink4);margin:2px}
.btn:hover{background:var(--ink4)}
.btn:active{transform:translateY(2px)}
.btn.pri{background:var(--acc);color:var(--ink0);--bc:color-mix(in srgb,var(--acc) 60%,var(--hi))}
.btn.pri:hover{background:color-mix(in srgb,var(--acc) 85%,var(--hi))}
.btn.ghost{background:transparent;--bc:var(--ink3);color:var(--text)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.sw{position:relative;width:44px;height:22px;flex:none;background:var(--ink0);border:0;padding:0;cursor:pointer;--bc:var(--ink4);margin:2px}
.sw-k{position:absolute;left:4px;top:4px;width:14px;height:14px;background:var(--mute);transition:left .16s steps(3)}
.sw[aria-checked="true"]{background:color-mix(in srgb,var(--acc) 30%,var(--ink0));--bc:var(--acc)}
.sw[aria-checked="true"] .sw-k{left:26px;background:var(--acc)}
.sw:disabled{opacity:.4;cursor:not-allowed}
.seg{display:inline-flex;flex-wrap:wrap;gap:6px}
.seg>button{background:var(--ink0);border:0;padding:7px 12px;cursor:pointer;font-size:13.5px;color:var(--text);--bc:var(--ink3);margin:2px}
.seg>button:hover{--bc:var(--ink4)}
.seg>button[aria-pressed="true"]{background:color-mix(in srgb,var(--acc) 24%,var(--ink0));color:var(--hi);--bc:var(--acc)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:6px;background:var(--ink0);box-shadow:0 -2px var(--ink4),0 2px var(--ink4),-2px 0 var(--ink4),2px 0 var(--ink4)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;margin-top:-4px;background:var(--acc);border:0;box-shadow:0 0 0 2px var(--ink0)}
input[type=range]::-moz-range-track{height:6px;background:var(--ink0);box-shadow:0 -2px var(--ink4),0 2px var(--ink4),-2px 0 var(--ink4),2px 0 var(--ink4)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;background:var(--acc);border:0;border-radius:0;box-shadow:0 0 0 2px var(--ink0)}
.rng{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;align-items:center;padding:14px 0;background:linear-gradient(90deg,var(--ink3) 50%,transparent 0) top left/4px 2px repeat-x}
.rng label{color:var(--hi);font-weight:500}
.rng output{font:500 14px var(--mono);color:var(--acc);text-align:right}
.rng .meta{grid-column:1/-1}
.field{width:100%;background:var(--ink0);border:0;padding:10px 12px;--bc:var(--ink3);font-size:15px;margin:2px;color:var(--hi)}
.field:focus{--bc:var(--acc);outline:none}
.field:focus-visible{outline:none}
textarea.field{min-height:120px;resize:vertical}
.chk{-webkit-appearance:none;appearance:none;width:18px;height:18px;margin:2px;background:var(--ink0);--bc:var(--ink4);cursor:pointer;flex:none}
.chk:checked{background:var(--acc);box-shadow:inset 0 0 0 4px var(--ink0),0 -2px 0 0 var(--acc),0 2px 0 0 var(--acc),-2px 0 0 0 var(--acc),2px 0 0 0 var(--acc)}
.chkrow{display:flex;align-items:center;gap:12px;cursor:pointer;color:var(--hi)}

/* home cards */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:24px;margin-bottom:24px}
.card{background:var(--panel);padding:18px;margin:2px;--bc:var(--ink4);position:relative;min-width:0}
.card.here{--bc:var(--acc)}
.card.off{opacity:.72}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:12px}
.devpic{width:144px;height:90px}
.here-badge{visibility:hidden;font:500 12px/1 var(--sans);padding:4px 7px;background:color-mix(in srgb,var(--acc) 22%,var(--ink0));color:var(--acc)}
.card.here .here-badge{visibility:visible}
.card h3{font:16px/1.2 var(--px);color:var(--hi);letter-spacing:.5px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:12px 0 0;font-size:13.5px}
.kv dt{color:var(--mute)}.kv dd{margin:0;color:var(--text)}
.batbar{display:inline-flex;gap:2px;vertical-align:-1px;margin-right:6px}
.batbar i{width:5px;height:10px;background:var(--ink3)}
.batbar i.on{background:var(--good)}
.shared{margin-top:14px;padding-top:12px;background:linear-gradient(90deg,var(--ink3) 50%,transparent 0) top left/4px 2px repeat-x}
.lbl{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:3px 8px;background:color-mix(in srgb,var(--c) 16%,var(--ink0));color:var(--c)}
.chip::before{content:"";width:6px;height:6px;background:var(--c)}

/* connection */
.code{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:6px 0 14px}
.code-d{width:44px;height:56px;display:grid;place-items:center;background:var(--ink0);font:32px/1 var(--px);color:var(--acc);--bc:var(--acc);margin:2px}
.code-gap{width:8px}
.big{color:var(--hi);font-weight:500;font-size:16px}
.cdbar{height:6px;background:var(--ink0);margin:12px 2px 2px;box-shadow:0 -2px var(--ink3),0 2px var(--ink3),-2px 0 var(--ink3),2px 0 var(--ink3)}
.cdbar i{display:block;height:100%;background:var(--acc);transition:width 1s steps(4)}
.devrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px;background:var(--ink0);--bc:var(--ink3);margin:2px 2px 14px}
.devrow canvas{width:72px;height:45px}
.devrow b{color:var(--hi);font-weight:500}
.devrow .seg{grid-column:1/-1}
.rule{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;background:var(--ink0);--bc:var(--ink3);margin:2px}
.rule .ic{color:var(--acc);margin-top:3px}
.rule b{color:var(--hi);font-weight:500}

/* mouse */
.logbox{background:#060910;--bc:var(--ink3);margin:2px;padding:12px 14px;overflow-x:auto;max-width:100%}
.logbox pre{margin:0;font:12.5px/1.75 var(--mono);color:var(--mute);white-space:pre}
.logbox .ok{color:var(--good)}.logbox .no{color:var(--warn)}.logbox .t{color:#566089}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:10px;font-size:13px;color:var(--mute)}
.legend span{display:inline-flex;align-items:center;gap:7px}

/* layout */
.stage{position:relative;width:100%;aspect-ratio:260/120;background:
  linear-gradient(90deg,rgba(54,63,99,.35) 1px,transparent 1px) 0 0/20px 20px,
  linear-gradient(rgba(54,63,99,.35) 1px,transparent 1px) 0 0/20px 20px,#0a0e1c;
  box-shadow:inset 0 0 0 2px var(--ink3);overflow:hidden;touch-action:none}
.tile{position:absolute;background:transparent;--bc:transparent;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.tile:focus-visible{outline:2px solid var(--hi);outline-offset:4px}
.tile.drag{cursor:grabbing;z-index:3}
.mon{position:absolute;background:var(--ink2);box-shadow:inset 0 0 0 2px var(--ink4);display:grid;place-items:center;font:500 12px/1 var(--sans);color:var(--mute);overflow:hidden;text-align:center}
.tile.drag .mon,.tile:hover .mon{box-shadow:inset 0 0 0 2px var(--mute)}
.tile.mac .mon{background:color-mix(in srgb,var(--acc) 14%,var(--ink2))}
.edge{position:absolute;background:var(--acc);pointer-events:none;animation:edge 1.6s steps(2) infinite}
@keyframes edge{50%{opacity:.35}}
.dir{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--ink0);--bc:var(--ink3);margin:2px 2px 12px}

/* clipboard */
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px;background:var(--ink0);--bc:var(--ink3);margin:2px 2px 14px}
.item svg{width:32px;height:32px}
.item b{display:block;color:var(--hi);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .to{font-size:12.5px;color:var(--acc);white-space:nowrap}

/* second screen */
.dircards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;margin-bottom:24px}
.dircard{display:flex;flex-direction:column;gap:10px}
.dircard.live{--bc:var(--acc)}
.bignum{font:32px/1 var(--px);color:var(--acc)}

/* camera */
.camopt{display:flex;align-items:center;gap:12px;padding:12px;background:var(--ink0);margin:2px 2px 12px;--bc:var(--ink3);box-shadow:0 -2px 0 0 var(--bc),0 2px 0 0 var(--bc),-2px 0 0 0 var(--bc),2px 0 0 0 var(--bc);width:calc(100% - 4px);border:0;cursor:pointer;text-align:left}
.camopt[aria-checked="true"]{--bc:var(--acc)}
.camopt .radio{width:14px;height:14px;background:var(--ink0);box-shadow:0 0 0 2px var(--ink4);flex:none}
.camopt[aria-checked="true"] .radio{background:var(--acc);box-shadow:0 0 0 2px var(--acc),inset 0 0 0 3px var(--ink0)}
.camopt b{color:var(--hi);font-weight:500}
.camopt .badge{margin-left:auto}

/* tip / feedback */
.sysinfo{margin-top:14px;background:#060910;padding:12px 14px;box-shadow:inset 0 0 0 2px var(--ink3)}
.sysinfo pre{margin:0;font:12.5px/1.75 var(--mono);color:var(--text);white-space:pre-wrap;word-break:break-word}
.confirm{display:flex;gap:16px;align-items:flex-start}
.confirm svg{width:42px;height:36px;flex:none}
.confirm h3{font:16px/1.3 var(--px);color:var(--hi);margin-bottom:6px;letter-spacing:.5px}
.credits p{margin-bottom:10px}
.credits p:last-child{margin-bottom:0}
.verline{display:flex;flex-wrap:wrap;gap:12px;align-items:center}

/* status bar */
.status{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;align-items:center;gap:6px;padding:7px var(--gr) calc(7px + env(safe-area-inset-bottom,0px)) var(--gl);background:rgba(8,11,22,.94);box-shadow:0 -2px 0 var(--ink3);font-size:13px;color:var(--mute)}
#stItems{display:flex;flex-wrap:wrap;align-items:center;gap:4px 18px;min-width:0;flex:1;overflow:hidden;max-height:22px}
.st{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.st b{color:var(--text);font-weight:500;font-variant-numeric:tabular-nums}
.st.off{color:#5a6388}
.st-cmd{display:inline-flex;align-items:center;gap:8px;background:var(--ink2);border:0;padding:4px 10px;cursor:pointer;color:var(--text);--bc:var(--ink4);margin:2px;flex:none;font-size:13px}

/* toast */
.toast{position:fixed;left:50%;bottom:58px;z-index:30;transform:translate(-50%,12px);opacity:0;pointer-events:none;background:var(--ink1);color:var(--hi);padding:10px 16px;--bc:var(--acc);font-weight:500;display:flex;align-items:center;gap:10px;transition:opacity .2s steps(2),transform .2s steps(2);max-width:calc(100vw - 40px)}
.toast::before{content:"";width:8px;height:8px;background:var(--acc);flex:none}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* command bar */
.cmd{position:fixed;inset:0;z-index:40}
.cmd-back{position:absolute;inset:0;background:rgba(4,6,12,.66)}
.cmd-panel{position:relative;margin:13vh auto 0;width:min(620px,calc(100vw - 40px));background:var(--ink1);--bc:var(--ink4);
  --h1:var(--acc);--h2:color-mix(in srgb,var(--acc) 42%,transparent);--h3:color-mix(in srgb,var(--acc) 16%,transparent)}
.cmd-panel.typing{animation:halo .9s step-end infinite;
  box-shadow:0 -2px 0 0 var(--h1),0 2px 0 0 var(--h1),-2px 0 0 0 var(--h1),2px 0 0 0 var(--h1),
    0 0 0 2px var(--h2),0 -6px 0 0 var(--h2),0 6px 0 0 var(--h2),-6px 0 0 0 var(--h2),6px 0 0 0 var(--h2),
    0 0 0 6px var(--h3),0 -10px 0 0 var(--h3),0 10px 0 0 var(--h3),-10px 0 0 0 var(--h3),10px 0 0 0 var(--h3)}
@keyframes halo{50%{box-shadow:0 -2px 0 0 var(--h1),0 2px 0 0 var(--h1),-2px 0 0 0 var(--h1),2px 0 0 0 var(--h1),
    0 0 0 2px var(--h2),0 -6px 0 0 var(--h2),0 6px 0 0 var(--h2),-6px 0 0 0 var(--h2),6px 0 0 0 var(--h2),
    0 0 0 6px var(--h2),0 -10px 0 0 var(--h2),0 10px 0 0 var(--h2),-10px 0 0 0 var(--h2),10px 0 0 0 var(--h2),
    0 0 0 10px var(--h3),0 -14px 0 0 var(--h3),0 14px 0 0 var(--h3),-14px 0 0 0 var(--h3),14px 0 0 0 var(--h3)}}
.cmd-in{display:flex;align-items:center;gap:12px;padding:14px 16px;box-shadow:0 2px 0 var(--ink3)}
.cmd-in .ic{color:var(--acc);width:18px;height:18px}
.cmd-in input{flex:1;min-width:0;background:transparent;border:0;outline:none;font-size:18px;color:var(--hi)}
.cmd-in input::placeholder{color:#5f6890}
#cmdList{list-style:none;margin:0;padding:8px;max-height:min(52vh,420px);overflow:auto}
#cmdList li{display:flex;align-items:center;gap:12px;padding:9px 12px;cursor:pointer;color:var(--text);position:relative}
#cmdList li .ic{color:var(--c,var(--mute))}
#cmdList li .hint{margin-left:auto;font-size:12px;color:var(--mute);white-space:nowrap}
#cmdList li[aria-selected="true"]{background:var(--ink2);color:var(--hi)}
#cmdList li[aria-selected="true"]::before{content:"";position:absolute;left:0;top:5px;bottom:5px;width:4px;background:var(--acc)}
#cmdList .empty{color:var(--mute);cursor:default}
.cmd-foot{display:flex;flex-wrap:wrap;gap:6px 16px;padding:10px 16px;box-shadow:0 -2px 0 var(--ink3);font-size:12px;color:var(--mute)}
.scrim{display:none}

/* responsive */
@media (max-width:1060px){
  .phead{grid-template-columns:minmax(0,1fr)}
  .ph-scene{max-width:480px}
}
@media (max-width:820px){
  .grid2,.dircards{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr);gap:0}

function sim(t) {

/* ---------- layout model ---------- */
const WORLD = {w:260, h:120};
const SIZES = {pc:{w:112, h:36}, mac:{w:38, h:25}};
const rectOf = k => ({...S.layout[k], ...SIZES[k]});
function candidates(mk) {
  const fk = mk === 'pc' ? 'mac' : 'pc', m = rectOf(mk), f = rectOf(fk);
  const cy = clamp(m.y, f.y - m.h + 6, f.y + f.h - 6), cx = clamp(m.x, f.x - m.w + 6, f.x + f.w - 6);
  return [
    {side:'right', x:f.x + f.w, y:cy}, {side:'left', x:f.x - m.w, y:cy},
    {side:'above', x:cx, y:f.y - m.h}, {side:'below', x:cx, y:f.y + f.h}
  ].map(c => ({...c, d:Math.hypot(c.x - m.x, c.y - m.y)}));
}
const inWorld = (c, k) => c.x >= 0 && c.y >= 0 && c.x + SIZES[k].w <= WORLD.w && c.y + SIZES[k].h <= WORLD.h;
function snap(mk) {
  const c = candidates(mk).sort((a, b) => a.d - b.d);
  const ok = c.find(x => inWorld(x, mk)) || c[0];
  S.layout[mk] = {x:ok.x, y:ok.y};
}
function relation() {
  const p = rectOf('pc'), m = rectOf('mac');
  if (Math.abs(m.x - (p.x + p.w)) < .6) return 'right';
  if (Math.abs(m.x + m.w - p.x) < .6) return 'left';
  if (Math.abs(m.y + m.h - p.y) < .6) return 'above';
  return 'below';
}
function sharedEdge() {
  const p = rectOf('pc'), m = rectOf('mac'), r = relation();
  if (r === 'right') { const a = Math.max(p.y + 4.5, m.y), b = Math.min(p.y + 31.5, m.y + m.h); return b > a ? {x1:m.x, y1:a, x2:m.x, y2:b} : null; }
  if (r === 'left') { const a = Math.max(p.y, m.y), b = Math.min(p.y + p.h, m.y + m.h); return b > a ? {x1:p.x, y1:a, x2:p.x, y2:b} : null; }
  const a = Math.max(p.x, m.x), b = Math.min(p.x + p.w, m.x + m.w);
  const y = r === 'above' ? p.y : p.y + p.h;
  return b > a ? {x1:a, y1:y, x2:b, y2:y} : null;
}
function positionTiles() {
  ['pc', 'mac'].forEach(k => {
    const el = $('#tile-' + k); if (!el) return; const r = rectOf(k);
    Object.assign(el.style, {left:r.x / WORLD.w * 100 + '%', top:r.y / WORLD.h * 100 + '%', width:r.w / WORLD.w * 100 + '%', height:r.h / WORLD.h * 100 + '%'});
  });
  const e = $('#edge'); if (!e) return; const s = sharedEdge();
  if (!s) { e.hidden = true; return; } e.hidden = false;
  const vert = s.x1 === s.x2;
  Object.assign(e.style, vert
    ? {left:`calc(${s.x1 / WORLD.w * 100}% - 2px)`, top:s.y1 / WORLD.h * 100 + '%', width:'4px', height:(s.y2 - s.y1) / WORLD.h * 100 + '%'}
    : {left:s.x1 / WORLD.w * 100 + '%', top:`calc(${s.y1 / WORLD.h * 100}% - 2px)`, height:'4px', width:(s.x2 - s.x1) / WORLD.w * 100 + '%'});
}
function layoutChanged(say) {
  positionTiles();
  const i = $('#layoutInfo'); if (i) i.textContent = edgeText();
  const r = relation();
  const pl = $('#layoutPill'); if (pl) pl.textContent = 'MacBook ' + (r === 'right' ? 'right of' : r === 'left' ? 'left of' : r) + (r === 'above' || r === 'below' ? ' PC' : ' PC');
  $$('[data-act="place"]').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === r));
  if (say) toast('Snapped: MacBook ' + (r === 'above' || r === 'below' ? r : r + ' of') + ' Windows PC');
}
function placeMac(side) {
  const c = candidates('mac').find(x => x.side === side);
  const p = rectOf('pc');
  if (side === 'right' || side === 'left') c.y = p.y + 4; else c.x = p.x + (p.w - 38) / 2;
  if (!inWorld(c, 'mac')) { S.layout.pc = {x:side === 'left' ? 110 : 46, y:side === 'above' ? 64 : side === 'below' ? 20 : 40}; return placeMac(side); }
  S.layout.mac = {x:c.x, y:c.y}; layoutChanged(true);
}

function startScreen(d) { S.screen.running = true; S.screen.dir = d; calcLat(); rerender(); toast(d === 'pc2mac' ? 'Second screen started on MacBook' : 'Second screen started on Windows PC'); }
function stopScreen() { if (!S.screen.running) return toast('Second screen isn’t running'); S.screen.running = false; rerender(); toast('Second screen stopped'); }
function setCam(v) {
  if (v && !S.multi) { S.multi = true; toast('Multi-device mode on. Camera shared from ' + S.camDevice); }
  else toast(v ? `Camera shared from ${S.camDevice}` : 'Camera sharing stopped');
  S.camera = v; rerender();
}
function setMulti(v) { S.multi = v; if (!v) S.camera = false; rerender(); toast(v ? 'Multi-device mode is on' : 'Two-computer mode'); }
function newCode() { S.pair = {code:String(Math.floor(Math.random() * 1e6)).padStart(6, '0'), left:120, total:120}; if (S.page === 'connection') rerender(); toast('New pairing code ready'); }
function calcLat() {
  const base = {usb:38, wifi:61, bt:118}[S.macLink];
  S.lat = base + Math.round((S.screen.quality - 50) / 8) + Math.round(Math.random() * 4 - 2);
}
const ACT = {
  cmd:() => openCmd(), cmdclose:() => closeCmd(), drawer:() => toggleDrawer(),
  mouse:() => setMouse(!S.mouse), clip:() => setClip(!S.clipboard), lock:() => setLock(!S.locked),
  link:el => setLink(el.dataset.v),
  pair:() => newCode(), pairCancel:() => { S.pair = {code:null, left:0, total:120}; rerender(); toast('Pairing cancelled'); },
  clipDir:el => { S.clipDir = el.dataset.v; rerender(); toast({both:'Clipboard goes both ways', toMac:'Clipboard goes to MacBook only', toPc:'Clipboard goes to Windows PC only'}[el.dataset.v]); },
  clipLimit:el => { S.clipLimit = el.dataset.v; rerender(); toast(el.dataset.v === '0' ? 'Files won’t be shared' : `Files up to ${el.dataset.v} MB`); },
  scrStart:el => startScreen(el.dataset.v), scrStop:() => stopScreen(),
  res:el => { S.screen.res = el.dataset.v; rerender(); toast(`Resolution ${el.dataset.v}`); },
  cam:() => setCam(!S.camera),
  camDev:el => { S.camDevice = el.dataset.v; rerender(); toast(S.camera ? `Camera now live from ${S.camDevice}` : `${S.camDevice} camera selected`); },
  multi:() => setMulti(!S.multi), wake:() => toast('Studio Mac mini is still offline'),
  place:el => placeMac(el.dataset.v),
  resetLayout:() => { S.layout = {pc:{x:46, y:40}, mac:{x:158, y:46}}; layoutChanged(false); toast('Layout reset'); },
  fbType:el => { S.fb.type = el.dataset.v; rerender(); },
  fbSend:() => { if (!S.fb.msg.trim()) { S.fb.err = true; rerender(); const m = $('#f-msg'); if (m) m.focus(); return; } S.fb.sent = true; S.fb.err = false; rerender(); toast('Feedback saved'); },
  fbAgain:() => { S.fb = {type:'bug', msg:'', sys:false, sent:false, err:false}; rerender(); },
  tipAmt:el => { S.tip.amt = el.dataset.v; rerender(); if (el.dataset.v === 'custom') { const i = $('#t-custom'); if (i) i.focus(); } },
  tipSend:() => { const a = S.tip.amt === 'custom' ? S.tip.custom : S.tip.amt; if (!a || +a < 1) { toast('Enter an amount first'); return; } S.tip.done = true; rerender(); toast('Thank you!'); },
  tipAgain:() => { S.tip.done = false; rerender(); }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const f = ACT[el.dataset.act]; if (f) { e.preventDefault(); f(el); }
});
document.addEventListener('input', e => {
  const k = e.target.dataset && e.target.dataset.input; if (!k) return;
  const v = e.target.value;
  if (k === 'cooldown') { S.cooldown = +v; $('#o-cool').textContent = v + ' ms'; }
  else if (k === 'guard') { S.guard = +v; $('#o-guard').textContent = v + ' ms'; }
  else if (k === 'quality') { S.screen.quality = +v; $('#o-q').textContent = v < 40 ? 'Faster' : v > 70 ? 'Sharper' : 'Balanced'; calcLat(); updateLive(); }
  else if (k === 'fbMsg') { S.fb.msg = v; }
  else if (k === 'tipCustom') { S.tip.custom = v.replace(/[^\d]/g, ''); const l = $('#tipLbl'); if (l) l.textContent = `Leave a $${S.tip.custom || '…'} tip`; }
});
document.addEventListener('change', e => {
  const k = e.target.dataset && e.target.dataset.change;
  if (k === 'fbSys') { S.fb.sys = e.target.checked; rerender(); }
  if (e.target.dataset && (e.target.dataset.input === 'cooldown' || e.target.dataset.input === 'guard')) toast(`${e.target.dataset.input === 'cooldown' ? 'Cooldown' : 'Arrival guard'} set to ${e.target.value} ms`);
});

/* layout dragging */
document.addEventListener('pointerdown', e => {
  const tile = e.target.closest('[data-tile]'); if (!tile) return;
  const stage = $('#stage'), r = stage.getBoundingClientRect(), k = tile.dataset.tile;
  const sx = WORLD.w / r.width, sy = WORLD.h / r.height, st = {...S.layout[k]}, x0 = e.clientX, y0 = e.clientY;
  tile.setPointerCapture(e.pointerId); tile.classList.add('drag'); e.preventDefault();
  const mv = ev => { S.layout[k] = {x:clamp(st.x + (ev.clientX - x0) * sx, 0, WORLD.w - SIZES[k].w), y:clamp(st.y + (ev.clientY - y0) * sy, 0, WORLD.h - SIZES[k].h)}; positionTiles(); };
  const up = () => { tile.removeEventListener('pointermove', mv); tile.removeEventListener('pointerup', up); tile.removeEventListener('pointercancel', up); tile.classList.remove('drag'); snap(k); layoutChanged(true); };
  tile.addEventListener('pointermove', mv); tile.addEventListener('pointerup', up); tile.addEventListener('pointercancel', up);
});

/* ---------- drawer ---------- */
function toggleDrawer(force) {
  const s = $('#side'), open = force !== undefined ? force : !s.classList.contains('open');
  s.classList.toggle('open', open); $('#scrim').classList.toggle('show', open);
  $('#menuBtn').setAttribute('aria-expanded', open);
  if (open) { const a = $('#nav a'); if (a) a.focus(); }
}
const closeDrawer = () => { if ($('#side').classList.contains('open')) toggleDrawer(false); };

/* ---------- command bar ---------- */
function commands() {
  const C = [
    {l:'Turn on clipboard', ic:'clip', c:'amber', w:() => !S.clipboard, run:() => setClip(true)},
    {l:'Turn off clipboard', ic:'clip', c:'amber', w:() => S.clipboard, run:() => setClip(false)},
    {l:'Turn mouse sharing on', ic:'mouse', c:'violet', w:() => !S.mouse, run:() => setMouse(true)},
    {l:'Turn mouse sharing off', ic:'mouse', c:'violet', w:() => S.mouse, run:() => setMouse(false)},
    {l:'Lock cursor to this screen', ic:'lock', c:'violet', w:() => !S.locked, run:() => setLock(true)},
    {l:'Unlock cursor', ic:'lock', c:'violet', w:() => S.locked, run:() => setLock(false)},
    {l:'Start second screen on MacBook', ic:'screen', c:'teal', w:() => !(S.screen.running && S.screen.dir === 'pc2mac'), run:() => startScreen('pc2mac')},
    {l:'Start second screen on Windows PC', ic:'screen', c:'teal', w:() => !(S.screen.running && S.screen.dir === 'mac2pc'), run:() => startScreen('mac2pc')},
    {l:'Stop second screen', ic:'screen', c:'teal', w:() => S.screen.running, run:() => stopScreen()},
    {l:'Share my camera', ic:'camera', c:'rose', w:() => !S.camera, run:() => setCam(true)},
    {l:'Stop sharing my camera', ic:'camera', c:'rose', w:() => S.camera, run:() => setCam(false)},
    {l:'Pair a new device', ic:'link', c:'cyan', run:() => { newCode(); go('connection'); }},
    {l:'Switch MacBook to USB cable', ic:'link', c:'cyan', w:() => S.macLink !== 'usb', run:() => setLink('usb')},
    {l:'Switch MacBook to Wi-Fi', ic:'link', c:'cyan', w:() => S.macLink !== 'wifi', run:() => setLink('wifi')},
    {l:'Switch MacBook to Bluetooth', ic:'link', c:'cyan', w:() => S.macLink !== 'bt', run:() => setLink('bt')},
    {l:'Turn on Multi-device mode', ic:'devices', c:'blue', w:() => !S.multi, run:() => setMulti(true)},
    {l:'Turn off Multi-device mode', ic:'devices', c:'blue', w:() => S.multi, run:() => setMulti(false)}
  ];
  PAGES.forEach(p => C.push({l:'Go to ' + p.t, ic:p.ic, c:p.acc, hint:'Page', run:() => go(p.id)}));
  return C.filter(c => !c.w || c.w());
}
function fuzzyWord(q, s) {
  let qi = 0, score = 0, prev = -2;
  for (let i = 0; i < s.length && qi < q.length; i++) {
    if (s[i] === q[qi]) { score += 1 + (i === prev + 1 ? 2 : 0) + (i === 0 || s[i - 1] === ' ' ? 3 : 0); prev = i; qi++; }
  }
  return qi === q.length ? score : 0;
}
function fuzzy(q, s) {
  const words = q.toLowerCase().trim().split(/\s+/).filter(Boolean); s = s.toLowerCase();
  if (!words.length) return 1;
  let total = 0; for (const w of words) { const v = fuzzyWord(w, s); if (!v) return 0; total += v; }
  return total;
}
let cmdView = [], cmdSel = 0, lastFocus = null, typingT;
function filterCmd() {
  const q = $('#cmdInput').value;
  cmdView = commands().map((c, i) => ({...c, s:fuzzy(q, c.l), i})).filter(c => c.s > 0).sort((a, b) => b.s - a.s || a.i - b.i);
  cmdSel = 0; drawCmd();
}
function drawCmd() {
  const ul = $('#cmdList'), inp = $('#cmdInput');
  if (!cmdView.length) { ul.innerHTML = `<li class="empty" role="option" aria-disabled="true">No matching command</li>`; inp.removeAttribute('aria-activedescendant'); return; }
  ul.innerHTML = cmdView.map((c, i) => `<li role="option" id="co-${i}" data-i="${i}" aria-selected="${i === cmdSel}" style="--c:var(--${c.c})">${ic(c.ic)}<span>${esc(c.l)}</span><span class="hint">${c.hint || 'Action'}</span></li>`).join('');
  inp.setAttribute('aria-activedescendant', 'co-' + cmdSel);
  const sel = $('#co-' + cmdSel); if (sel) sel.scrollIntoView({block:'nearest'});
}
function openCmd() {
  if (!$('#cmd').hidden) return;
  lastFocus = document.activeElement; closeDrawer();
  $('#cmd').hidden = false; const i = $('#cmdInput'); i.value = ''; filterCmd(); i.focus();
}
function closeCmd() {
  $('#cmd').hidden = true; $('#cmdPanel').classList.remove('typing');
  if (lastFocus && document.contains(lastFocus)) lastFocus.focus();
}
function runCmd(i) { const c = cmdView[i]; if (!c) return; closeCmd(); c.run(); }
$('#cmdInput').addEventListener('input', () => {
  const p = $('#cmdPanel'); p.classList.add('typing'); clearTimeout(typingT);
  typingT = setTimeout(() => p.classList.remove('typing'), 900);
  filterCmd();
});
$('#cmdInput').addEventListener('keydown', e => {
  if (e.key === 'ArrowDown') { e.preventDefault(); if (cmdView.length) { cmdSel = (cmdSel + 1) % cmdView.length; drawCmd(); } }
  else if (e.key === 'ArrowUp') { e.preventDefault(); if (cmdView.length) { cmdSel = (cmdSel - 1 + cmdView.length) % cmdView.length; drawCmd(); } }
  else if (e.key === 'Enter') { e.preventDefault(); runCmd(cmdSel); }
  else if (e.key === 'Tab') e.preventDefault();
});
$('#cmdList').addEventListener('click', e => { const li = e.target.closest('li[data-i]'); if (li) runCmd(+li.dataset.i); });
$('#cmdList').addEventListener('mousemove', e => { const li = e.target.closest('li[data-i]'); if (li && +li.dataset.i !== cmdSel) { cmdSel = +li.dataset.i; drawCmd(); } });
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && (e.key === 'k' || e.key === 'K')) { e.preventDefault(); if ($('#cmd').hidden) openCmd(); else closeCmd(); return; }
  if (e.key === 'Escape') { if (!$('#cmd').hidden) { e.preventDefault(); closeCmd(); } else closeDrawer(); return; }
  const tile = e.target.closest && e.target.closest('[data-tile]');
  if (tile && e.key.startsWith('Arrow')) {
    e.preventDefault(); const k = tile.dataset.tile, d = 8;
    const L = S.layout[k];
    if (e.key === 'ArrowLeft') L.x -= d; if (e.key === 'ArrowRight') L.x += d; if (e.key === 'ArrowUp') L.y -= d; if (e.key === 'ArrowDown') L.y += d;
    L.x = clamp(L.x, 0, WORLD.w - SIZES[k].w); L.y = clamp(L.y, 0, WORLD.h - SIZES[k].h);
    snap(k); layoutChanged(false);
  }
});

/* ---------- sky: ordered-dither spectral gradient ---------- */
const sky = $('#sky'), sc = sky.getContext('2d');
const RAMP = [[8,11,22],[10,14,30],[14,18,40],[19,23,52],[27,26,64],[38,31,76],[26,46,80],[21,60,74],[52,44,66],[70,58,60]];
const B4 = [0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5].map(v => (v + .5) / 16);
const PXS = 5;
let SW = 0, SH = 0, img = null, colC, colS, stars = [];
function skySize() {
  SW = Math.max(1, Math.ceil((innerWidth || 1280) / PXS)); SH = Math.max(1, Math.ceil((innerHeight || 800) / PXS));
  sky.width = SW; sky.height = SH; img = sc.createImageData(SW, SH);
  colC = new Float32Array(SW); colS = new Float32Array(SW);
  stars = []; let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < Math.round(SW * SH / 600); i++) stars.push([Math.floor(rnd() * SW), Math.floor(rnd() * SH * .7), rnd() * 6.28, rnd() > .8]);
}
function drawSky(t) {
  if (!img) return;
  const d = img.data, N = RAMP.length - 1;
  for (let x = 0; x < SW; x++) { const u = x / SW; colC[x] = .5 + .13 * Math.sin(u * 5.2 + t * .05) + .06 * Math.sin(u * 11 - t * .08); colS[x] = Math.sin(u * 3.1 + t * .03); }
  for (let y = 0; y < SH; y++) {
    const v = y / SH, base = .25 + 2.3 * v * v;
    for (let x = 0; x < SW; x++) {
      const dy = (v - colC[x]) / .15, band = Math.exp(-dy * dy);
      let idx = base * (1 - band * .35) + band * (4.3 + 2.1 * colS[x]);
      idx = idx < 0 ? 0 : idx > N - .001 ? N - .001 : idx;
      const i0 = idx | 0, c = RAMP[(idx - i0) > B4[(y & 3) * 4 + (x & 3)] ? i0 + 1 : i0];
      const o = (y * SW + x) * 4; d[o] = c[0]; d[o + 1] = c[1]; d[o + 2] = c[2]; d[o + 3] = 255;
    }
  }
  for (const [x, y, ph, big] of stars) {
    const tw = Math.sin(t * .9 + ph); if (tw < -.4) continue;
    const o = (y * SW + x) * 4, b = big ? 180 : 110;
    d[o] = b - 10; d[o + 1] = b - 6; d[o + 2] = b + 20 > 255 ? 255 : b + 20;
  }
  sc.putImageData(img, 0, 0);
}

/* ---------- loop ---------- */
const t0 = performance.now();
const T = () => RM.matches ? 2.2 : (performance.now() - t0) / 1000;
function drawScene(t) {
  const cv = $('#scene'); if (!cv) return;
  const c = cv.getContext('2d'); c.clearRect(0, 0, cv.width, cv.height);
  (SC[S.page] || SC.home)(c, t);
}
let lastS = 0, lastK = 0, running = false;
function loop(now) {
  if (RM.matches) { running = false; return; }
  // rAF timestamps can predate t0 on the first frame; never let time go negative
  const t = Math.max(0, now - t0) / 1000;
  sim(t);
  if (now - lastS > 83) { lastS = now; drawScene(t); }
  if (now - lastK > 160) { lastK = now; drawSky(t); }
  requestAnimationFrame(loop);
}
function startMotion() {
  if (RM.matches) { curPos = {x:1100, y:720}; curDev = 'mon0'; S.active = 'Windows PC'; drawSky(4); drawScene(T()); updateLive(); return; }
  if (!running) { running = true; requestAnimationFrame(loop); }
}
(RM.addEventListener ? RM.addEventListener.bind(RM, 'change') : RM.addListener.bind(RM))(startMotion);
window.addEventListener('resize', () => { skySize(); drawSky(T()); });

setInterval(() => {
  S.tick++;
  if (S.macLink === 'wifi') S.ping = clamp(S.ping + Math.round(Math.random() * 2 - 1), 3, 7);
  else if (S.macLink === 'usb') S.ping = 1;
  else S.ping = clamp(S.ping + Math.round(Math.random() * 4 - 2), 9, 16);
  calcLat();
  if (S.tick % 24 === 0 && S.battery > 5) S.battery--;
  if (S.pair.code && S.pair.left > 0) { S.pair.left--; if (S.pair.left === 0 && S.page === 'connection') rerender(); }
  updateLive();
  if (RM.matches && (S.page === 'layout' || S.page === 'camera')) drawScene(T());
}, 1000);

/* ---------- boot ---------- */
$('#brandSide').innerHTML = LOGO_SVG + '<span>OmniDesk</span>';
$('#brandTop').innerHTML = LOGO_SVG + '<span>OmniDesk</span>';
$('#menuBtn').innerHTML = ic('menu');
$('#cmdTop').innerHTML = ic('search');
$('#cmdIc').innerHTML = ic('search');
$('#navcmd').innerHTML = `${ic('search')}<span>Search or run…</span><kbd>${KEY}</kbd>`;
$('#stCmd').innerHTML = `${ic('search')}<span>${KEY}</span>`;
skySize();
const startId = location.hash.slice(1);
S.page = PG[startId] ? startId : 'home';
calcLat();
render(false);
drawSky(T());
startMotion();
})();
</script>
