<title>OmniDesk · ASCII</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
@import url("https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&display=swap");
:root{
  color-scheme:dark;
  --bg:#131417; --bg2:#18191d;
  --pn:rgba(22,23,27,.9); --pn2:rgba(30,31,36,.92);
  --line:#34353b; --line2:#4d4e56;
  --tx:#e9e3d7; --mu:#a29c90; --fa:#68645d; --ff:#3f3d39;
  --cy:#7cc7d0; --vi:#a99bdd; --am:#dbb36f; --te:#72c8a6; --ro:#de92a2; --bl:#89a8e2; --warm:#d6c6a6;
  --good:#97cb8c; --warn:#e3a35f; --bad:#e2867a;
  --scrim:rgba(9,9,11,.6);
  --acc:var(--warm);
  --lh:20px;
  --mono:"JetBrains Mono","IBM Plex Mono",ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--tx);font:400 13px/20px var(--mono);-webkit-font-smoothing:antialiased;overflow-x:hidden}
#field{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse at 50% 40%,transparent 40%,rgba(10,10,12,.55) 100%)}
a{color:inherit}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:1px dashed var(--acc);outline-offset:2px;border-radius:2px}
::selection{background:color-mix(in oklab,var(--acc) 35%,transparent)}

/* app frame */
.app{position:relative;z-index:1;max-width:1320px;margin:0 auto;min-height:100dvh;display:grid;grid-template-columns:236px minmax(0,1fr);grid-template-rows:auto 1fr auto;column-gap:20px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:14px 0 10px;min-width:0}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;white-space:nowrap}
.brand b{font-weight:500;letter-spacing:.02em}
.crumb{color:var(--fa);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.crumb span{color:var(--mu)}
.spacer{flex:1}
.kbtn{background:var(--pn);border:1px solid var(--line2);border-radius:4px;padding:3px 10px;cursor:pointer;color:var(--mu);white-space:nowrap}
.kbtn:hover{color:var(--tx);border-color:var(--fa)}
.kbtn kbd{color:var(--tx)}
.menu-btn{display:none}
kbd{font:inherit;color:var(--tx);border:1px solid var(--line2);border-bottom-width:2px;border-radius:3px;padding:0 4px;font-size:12px}

/* character-framed boxes */
.box{position:relative;margin:0 0 16px;min-width:0;display:flex;flex-direction:column;
  background:linear-gradient(var(--pn),var(--pn)) no-repeat;background-position:.5ch calc(var(--lh)/2);background-size:calc(100% - 1ch) calc(100% - var(--lh))}
.box::before,.box::after{content:"";position:absolute;top:calc(var(--lh)/2);bottom:calc(var(--lh)/2);width:1px;background:var(--line2)}
.box::before{left:calc(.5ch - .5px)}
.box::after{right:calc(.5ch - .5px)}
.bt,.bb{display:flex;white-space:pre;color:var(--line2);height:var(--lh);overflow:hidden;user-select:none;position:relative}
.bt .lbl{color:var(--mu);flex:none}
.bt .lbl.t{color:var(--acc)}
.bt .lbl.r{color:var(--fa)}
.fill{flex:1 1 0;overflow:hidden;min-width:1ch}
.bi{padding:6px 2ch 8px;position:relative;min-width:0;flex:1}
.box.sq .bt,.box.sq .bb{color:var(--line)}
.box.sq::before,.box.sq::after{background:var(--line)}
.livedot{color:var(--acc);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}

/* sidebar */
.side{position:sticky;top:12px;align-self:start;min-width:0}
.grp{display:flex;color:var(--fa);white-space:pre;overflow:hidden;margin-top:10px;text-transform:lowercase}
.grp:first-child{margin-top:0}
.it{display:flex;gap:1ch;align-items:center;text-decoration:none;color:var(--mu);padding:1px 1ch;border-radius:3px;white-space:nowrap}
.it .g{width:2ch;text-align:center}
.it .m{color:transparent;width:1ch}
.it:hover{color:var(--tx);background:rgba(255,255,255,.03)}
.it[aria-current="page"]{color:var(--tx);background:color-mix(in oklab,var(--c) 13%,transparent)}
.it[aria-current="page"] .m{color:var(--c)}
.me{color:var(--fa);margin-top:6px}
.me b{color:var(--mu);font-weight:400}

/* main */
main{min-width:0;padding-bottom:24px}
.ph h1{font-size:22px;line-height:30px;font-weight:500;letter-spacing:-.01em;margin:2px 0 0;outline:none}
.ph .pfx{color:var(--fa);font-weight:300}
.sub{color:var(--mu);margin:2px 0 12px}
.sub b{color:var(--acc);font-weight:500}
.art{container-type:inline-size;display:flex;justify-content:center;overflow:hidden;padding:4px 0}
.art pre{margin:0;font-family:var(--mono);font-size:min(13px,calc(100cqw / (var(--cols) * .605)));line-height:1.3;width:max-content;color:var(--mu)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));column-gap:16px}
.span2{grid-column:1/-1}
p{margin:0 0 10px}
.muted{color:var(--mu)} .faint{color:var(--fa)}
.note{color:var(--mu);border-left:1px solid var(--line2);padding-left:1.5ch;margin:8px 0}
.kv{display:flex;gap:1ch;white-space:nowrap;min-width:0}
.kv .k{color:var(--mu);flex:none}
.kv .dots{flex:1 1 0;overflow:hidden;color:var(--ff);min-width:1ch}
.kv .v{flex:none;max-width:70%;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-block;color:var(--c,var(--acc));border:1px solid color-mix(in oklab,var(--c,var(--acc)) 40%,transparent);border-radius:3px;padding:0 .6ch;line-height:17px;margin:2px 4px 2px 0;font-size:12px}
.badge{display:inline-block;font-size:11px;line-height:16px;padding:0 .8ch;border-radius:3px;color:var(--acc);border:1px dashed color-mix(in oklab,var(--acc) 55%,transparent);vertical-align:3px;margin-left:1ch;font-weight:400;letter-spacing:.02em}
.hr{color:var(--line);white-space:pre;overflow:hidden;height:var(--lh);margin:4px 0}

/* controls */
.btn{background:transparent;border:0;padding:1px 3px;cursor:pointer;border-radius:3px;color:var(--tx);white-space:nowrap}
.btn::before{content:"[ ";color:var(--fa)}
.btn::after{content:" ]";color:var(--fa)}
.btn:hover{background:color-mix(in oklab,var(--acc) 13%,transparent)}
.btn.pri{color:var(--acc)}
.btn.pri::before,.btn.pri::after{color:color-mix(in oklab,var(--acc) 60%,var(--fa))}
.btn[disabled]{color:var(--fa);cursor:not-allowed}
.sw{display:flex;width:100%;align-items:center;gap:1ch;background:none;border:0;padding:3px 0;cursor:pointer;text-align:left;color:var(--tx)}
.sw .lab{flex:1;min-width:0}
.sw .sw-g{color:var(--fa);white-space:pre;flex:none}
.sw.on .sw-g{color:var(--acc);text-shadow:0 0 10px color-mix(in oklab,var(--acc) 55%,transparent)}
.sw.big{font-size:15px;padding:8px 0}
.seg{display:inline-flex;flex-wrap:wrap;align-items:center;color:var(--fa)}
.seg::before{content:"("}
.seg::after{content:")"}
.seg button{background:none;border:0;color:var(--mu);padding:0 1ch;cursor:pointer;border-radius:3px;white-space:nowrap}
.seg button+button{border-left:1px solid var(--line);border-radius:0}
.seg button:hover{color:var(--tx)}
.seg button[aria-checked="true"]{color:var(--bg);background:var(--acc);border-radius:2px}
.row{display:flex;align-items:center;gap:1ch;flex-wrap:wrap;margin:6px 0}
.row .k{color:var(--mu);min-width:14ch}
.sl{display:block;margin:6px 0 10px}
.sl-h{display:flex;justify-content:space-between;gap:1ch}
.sl-h b{color:var(--acc);font-weight:500}
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;width:100%;height:20px;margin:2px 0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:1px;background:repeating-linear-gradient(90deg,var(--line2) 0 4px,transparent 4px 8px)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:8px;height:14px;margin-top:-7px;background:var(--acc);border-radius:1px;box-shadow:0 0 10px color-mix(in oklab,var(--acc) 50%,transparent)}
input[type=range]::-moz-range-track{height:1px;background:var(--line2)}
input[type=range]::-moz-range-thumb{width:8px;height:14px;border:0;background:var(--acc);border-radius:1px}
.rule{display:flex;gap:1ch;align-items:baseline;flex-wrap:wrap;color:var(--tx);margin-top:6px}
.tag{color:var(--fa);font-size:12px}
.field-in,textarea{width:100%;background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:3px;color:var(--tx);padding:6px 1ch;resize:vertical}
.field-in:focus,textarea:focus{border-color:var(--acc);outline:none;box-shadow:0 0 0 1px color-mix(in oklab,var(--acc) 30%,transparent)}
input[type=checkbox]{-webkit-appearance:none;appearance:none;margin:0;width:3ch;height:20px;cursor:pointer;color:var(--fa);flex:none}
input[type=checkbox]::before{content:"[ ]";font:inherit}
input[type=checkbox]:checked::before{content:"[x]";color:var(--acc)}
.cb{display:flex;gap:1ch;align-items:center;cursor:pointer}
pre.plain{margin:6px 0;white-space:pre-wrap;word-break:break-word;font:inherit;color:var(--mu);background:rgba(0,0,0,.22);padding:8px 1.5ch;border-left:1px solid var(--acc)}
.log{margin:0;white-space:pre-wrap;word-break:break-all;font:12px/18px var(--mono);color:var(--mu);min-height:144px}
.log .ts{color:var(--fa)} .log .w{color:var(--warn)} .log .g{color:var(--good)}
.code{font-size:34px;line-height:46px;letter-spacing:.18em;color:var(--acc);font-weight:500;text-shadow:0 0 18px color-mix(in oklab,var(--acc) 35%,transparent);margin:6px 0}
.list{margin:0;padding:0;list-style:none}
.list li{display:flex;gap:1ch;align-items:flex-start;padding:6px 0;border-bottom:1px dashed var(--line)}
.list li:last-child{border-bottom:0}
.list .ic{flex:none;color:var(--acc);white-space:pre;line-height:16px;font-size:12px}
.list .bd{flex:1;min-width:0}
.list .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list .meta{color:var(--fa);font-size:12px}
.dev{display:grid;grid-template-columns:2ch minmax(0,1fr) auto;gap:0 1ch;padding:6px 0;border-bottom:1px dashed var(--line);align-items:baseline}
.dev:last-child{border-bottom:0}
.ok{color:var(--good)} .wn{color:var(--warn)} .bad{color:var(--bad)}
.board-wrap pre{cursor:grab;touch-action:none;user-select:none;outline-offset:4px}
.board-wrap pre.drag{cursor:grabbing}
.edge{margin:2px 0}
.thx{font-size:15px;line-height:24px}

/* k- classes for character grids */
.k-f{color:var(--ff)} .k-d{color:var(--fa)} .k-m{color:var(--mu)} .k-t{color:var(--tx)} .k-l{color:var(--line2)}
.k-a{color:var(--acc)} .k-a2{color:color-mix(in oklab,var(--acc) 42%,var(--bg))}
.k-b{color:color-mix(in oklab,var(--acc) 70%,#fff);text-shadow:0 0 8px color-mix(in oklab,var(--acc) 60%,transparent)}
.k-g{color:var(--good)} .k-w{color:var(--warn)} .k-r{color:var(--bad)}
.k-cy{color:var(--cy)} .k-vi{color:var(--vi)} .k-am{color:var(--am)} .k-te{color:var(--te)} .k-ro{color:var(--ro)} .k-bl{color:var(--bl)}

/* status bar */
.status{grid-column:1/-1;position:sticky;bottom:0;z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:0 1ch;padding:6px 1.5ch;margin:0 0 10px;
  background:rgba(17,18,21,.94);border:1px solid var(--line);border-radius:4px;color:var(--mu);font-size:12px;backdrop-filter:blur(6px)}
.status .sep{color:var(--line2)}
.status b{font-weight:400;color:var(--tx)}
.status svg{vertical-align:-2px}
.status .grow{flex:1}

/* command bar */
.cmd{position:fixed;inset:0;z-index:40;background:var(--scrim);backdrop-filter:blur(3px);padding:12vh 16px 16px}
.cmd[hidden]{display:none}
.cmd .box{max-width:660px;margin:0 auto;--pn:rgba(20,21,25,.97);transition:filter .25s}
.cmd.typing .box{filter:drop-shadow(0 0 14px color-mix(in oklab,var(--glow) 40%,transparent))}
.prompt{display:flex;align-items:center;gap:1ch;font-size:15px;line-height:28px;padding:2px 0 8px;border-bottom:1px dashed var(--line);margin-bottom:6px}
.ps{color:var(--glow);white-space:nowrap}
.fld{position:relative;flex:1;min-width:0}
.fld input{width:100%;background:transparent;border:0;outline:none;caret-color:transparent;padding:0;font-size:15px;line-height:28px}
.fld input::placeholder{color:var(--fa)}
.caret{position:absolute;top:4px;width:1ch;height:20px;background:var(--glow);animation:blink 1.05s steps(1) infinite;pointer-events:none;opacity:.85}
.cmd.typing .caret{animation:none;opacity:1;box-shadow:0 0 10px var(--glow),0 0 22px color-mix(in oklab,var(--glow) 60%,transparent)}
.cmd.typing .fld input{text-shadow:0 0 12px color-mix(in oklab,var(--glow) 55%,transparent)}
@keyframes blink{50%{opacity:0}}
#cmdlist{list-style:none;margin:0;padding:0;max-height:min(46vh,380px);overflow:auto}
#cmdlist li{display:flex;gap:1ch;padding:2px 1ch;border-radius:3px;cursor:pointer;color:var(--mu)}
#cmdlist li .mk{color:transparent;flex:none}
#cmdlist li .lb{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#cmdlist li .lb em{font-style:normal;color:var(--tx);text-decoration:underline;text-decoration-color:color-mix(in oklab,var(--c) 60%,transparent);text-underline-offset:3px}
#cmdlist li .hn{color:var(--c);font-size:12px;opacity:.8}
#cmdlist li[aria-selected="true"]{background:color-mix(in oklab,var(--c) 14%,transparent);color:var(--tx)}
#cmdlist li[aria-selected="true"] .mk{color:var(--c)}
.cmd-foot{color:var(--fa);font-size:12px;margin-top:6px}

/* toast */
.toast{position:fixed;right:max(24px,env(safe-area-inset-right,0px));bottom:64px;z-index:50;min-width:240px;max-width:calc(100% - 32px);visibility:hidden;opacity:0;transform:translateY(6px);transition:opacity .2s,transform .2s,visibility .2s}
.toast.show{visibility:visible;opacity:1;transform:none}
.toast .box{margin:0;--pn:rgba(24,25,29,.97);--acc:var(--good)}

@media (max-width:860px){
  .grid3{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none;position:static}
  .app.menu .side{display:block}
  .menu-btn{display:inline-block}
  .grid2{grid-template-columns:minmax(0,1fr)}
  .crumb{display:none}
  .kbtn .kl{display:none}
  .code{font-size:26px;letter-spacing:.12em}
  .toast{left:16px;right:16px;bottom:96px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .caret{opacity:1}
}
</style>

<canvas id="field" aria-hidden="true"></canvas>
<div class="app" id="app">
  <header class="top">
    <button class="btn menu-btn" data-act="menu" id="menu-btn" aria-expanded="false" aria-controls="side">menu</button>
    <a class="brand" href="#home" aria-label="OmniDesk home">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
        <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--cy)"/><stop offset=".5" style="stop-color:var(--vi)"/><stop offset="1" style="stop-color:var(--ro)"/></linearGradient></defs>
        <rect x="1.5" y="3.5" width="12.5" height="9" rx="2" fill="none" stroke="url(#lg)" stroke-width="1.5"/>
        <rect x="10" y="11.5" width="12.5" height="9" rx="2" fill="none" stroke="url(#lg)" stroke-width="1.5"/>
        <path d="M11.6 7.2l5.2 1.9-2.2.8-.8 2.2z" style="fill:var(--tx)"/>
      </svg>
      <b>omnidesk</b>
    </a>
    <div class="crumb" id="crumb"></div>
    <div class="spacer"></div>
    <button class="kbtn" data-act="cmd" id="cmd-btn" aria-haspopup="dialog"><span aria-hidden="true">❯_</span> <span class="kl">commands</span> <kbd id="kbd-hint">Ctrl K</kbd></button>
  </header>
  <aside class="side" id="side"></aside>
  <main id="main"></main>
  <footer class="status" id="status" aria-label="Status"></footer>
</div>

<div class="cmd" id="cmd" hidden role="dialog" aria-modal="true" aria-label="Command bar">
  <div id="cmdbox"></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
const LINE='─'.repeat(260), DOTS='·'.repeat(160);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const RM=matchMedia('(prefers-reduced-motion: reduce)');
let reduce=RM.matches;
const isMac=/Mac|iPhone|iPad/.test(navigator.platform||navigator.userAgent);

/* ---------- pages ---------- */
const PAGES={
  home:{t:'Home',acc:'--warm',g:'⌂',path:''},
  mouse:{t:'Mouse & keyboard',acc:'--vi',g:'↖',path:'share/'},
  layout:{t:'Screen layout',acc:'--vi',g:'▦',path:'share/'},
  clipboard:{t:'Clipboard',acc:'--am',g:'▤',path:'share/'},
  screen:{t:'Second screen',acc:'--te',g:'▭',path:'share/'},
  camera:{t:'Camera',acc:'--ro',g:'◉',path:'share/'},
  connection:{t:'Connection',acc:'--cy',g:'≋',path:'devices/'},
  devices:{t:'Multi-device',acc:'--bl',g:'∴',path:'devices/'},
  tip:{t:'Tip',acc:'--warm',g:'♥',path:'more/'},
  feedback:{t:'Feedback',acc:'--warm',g:'✎',path:'more/'},
  about:{t:'About',acc:'--warm',g:'i',path:'more/'}
};
const NAV=[['',['home']],['share',['mouse','layout','clipboard','screen','camera']],['devices',['connection','devices']],['more',['tip','feedback','about']]];

/* ---------- state ---------- */
const DEFAULT_L=()=>({pc:{x:5,y:3},mac:{x:31,y:4}});
const S={
  page:'home', clip:true, mouse:true, locked:false, cooldown:250, guard:150,
  link:'wifi', ping:4, batt:82, active:'Windows PC',
  ss:{on:null,res:{mac:'1920×1080',pc:'2560×1600'},q:50,lat:61},
  cam:{on:false,src:'Windows PC'}, multi:true, pair:null, clipLimit:'50 MB',
  L:DEFAULT_L(), sel:'mac',
  tip:{amt:'5',custom:'',done:false},
  fb:{type:'Idea',msg:'',sys:false,sent:false},
  log:[], menu:false
};
const CLIP=[
  {kind:'file',name:'Quarterly plan v3.docx',meta:'2.4 MB',from:'MacBook',to:'Windows PC',ago:'2 min ago'},
  {kind:'image',name:'Screenshot.png',meta:'PNG · 1440×900',from:'Windows PC',to:'MacBook',ago:'9 min ago'},
  {kind:'text',name:'“meet at 4:30, room B”',meta:'text · 20 chars',from:'MacBook',to:'Windows PC',ago:'14 min ago'}
];
const linkName=()=>({wifi:'Wi-Fi',usb:'USB cable',bt:'Bluetooth'})[S.link];
const fmtT=d=>d.toTimeString().slice(0,8);
const bar=(f,n)=>'▮'.repeat(Math.round(f*n))+'▯'.repeat(n-Math.round(f*n));
function newPing(){S.ping=S.link==='wifi'?3+Math.round(Math.random()*4):S.link==='usb'?(Math.random()<.8?1:2):10+Math.round(Math.random()*6);}
function ssBase(){return S.link==='usb'?38:S.link==='wifi'?61:null;}
function newLat(){const b=ssBase();S.ss.lat=b==null?null:Math.max(20,Math.round(b+(S.ss.q-50)*.2+(Math.random()*4-2)));}

/* ---------- character grid ---------- */
class G{
  constructor(w,h){this.w=w;this.h=h;this.c=new Array(w*h).fill(' ');this.k=new Array(w*h).fill('');}
  set(x,y,ch,k=''){x=Math.round(x);y=Math.round(y);if(x<0||y<0||x>=this.w||y>=this.h)return;const i=y*this.w+x;this.c[i]=ch;this.k[i]=k;}
  text(x,y,s,k){let i=0;for(const ch of String(s)){this.set(x+i,y,ch,k);i++;}}
  spr(x,y,lines,k){lines.forEach((l,j)=>{let i=0;for(const ch of l){if(ch!==' ')this.set(x+i,y+j,ch,k);i++;}});}
  fill(x,y,w,h,ch,k=''){for(let j=0;j<h;j++)for(let i=0;i<w;i++)this.set(x+i,y+j,ch,k);}
  box(x,y,w,h,k,round){const [a,b,c,d]=round?['╭','╮','╰','╯']:['┌','┐','└','┘'];
    for(let i=1;i<w-1;i++){this.set(x+i,y,'─',k);this.set(x+i,y+h-1,'─',k);}
    for(let j=1;j<h-1;j++){this.set(x,y+j,'│',k);this.set(x+w-1,y+j,'│',k);}

    if(!reduce&&n<=all.length&&Math.floor(t*2)%2===0)g.set(4+col,2+row*2,'▌','k-a');
    g.spr(44,2,['┌──────────────┐','│╲            ╱│','│  ╲        ╱  │','│    ╲ ── ╱    │','└──────────────┘'],S.fb.sent?'k-g':'k-a');
    g.text(44,8,S.fb.sent?'✓ sent · thanks':`type: ${S.fb.type.toLowerCase()}`,S.fb.sent?'k-g':'k-d');
  },
  about(g,t){
    const F={O:['╭─╮','│ │','╰─╯'],M:['╭┬╮','│││','╵╵╵'],N:['╭╮╷','│││','╵╰╯'],I:['╶┬╴',' │ ','╶┴╴'],D:['┌─╮','│ │','└─╯'],E:['┌─╴','├─ ','└─╴'],S:['╭─╴','╰─╮','╶─╯'],K:['│╭╯','├┤ ','│╰╮']};
    'OMNIDESK'.split('').forEach((ch,i)=>{const h=(195+i*22+(reduce?0:t*14))%360;g.spr(15+i*4,1,F[ch],`s:hsl(${h} 42% 72%)`);});
    g.text(15,5,'one desk for all your computers','k-m');
    g.text(15,7,'v2.5.0 · GPL-2.0-only','k-d');
  }
};

function drawBoard(){const pre=$('#board');if(!pre)return;const g=new G(BW,BH);

  const mons=MON(S.L.pc),M={x:S.L.mac.x,y:S.L.mac.y,w:MW,h:MH},sp=S.sel==='pc',sm=S.sel==='mac';
  mons.forEach((m,i)=>{g.fill(m.x,m.y,m.w,m.h,' ');g.box(m.x,m.y,m.w,m.h,sp?'k-a':'k-t');g.text(m.x+2,m.y+1,i?'2':'1','k-m');g.text(m.x+1,m.y+2,i?'1920×1080':' 2560×1440','k-d');});

  g.fill(M.x,M.y,M.w,M.h,' ');g.box(M.x,M.y,M.w,M.h,sm?'k-a':'k-t',true);g.text(M.x+1,M.y+1,'MacBook','k-m');g.text(M.x+1,M.y+2,'1512×982','k-d');
  if(sm)g.text(M.x,M.y+M.h,'› selected','k-a');
  const cs=contacts();
  cs.forEach(c=>{const m=mons[c.mon];
    if(c.side==='right'||c.side==='left'){const y0=Math.max(m.y,M.y),y1=Math.min(m.y+m.h,M.y+M.h);for(let y=y0;y<y1;y++){g.set(c.side==='right'?m.x+m.w-1:m.x,y,'┃','k-b');g.set(c.side==='right'?M.x:M.x+M.w-1,y,'┃','k-b');}}
    else{const x0=Math.max(m.x,M.x),x1=Math.min(m.x+m.w,M.x+M.w);for(let x=x0;x<x1;x++){g.set(x,c.side==='top'?m.y:m.y+m.h-1,'━','k-b');g.set(x,c.side==='top'?M.y+M.h-1:M.y,'━','k-b');}}});
  pre.innerHTML=g.html();
  const ed=$('#edges');if(ed)ed.innerHTML=(cs.length?cs.map(c=>`<div class="edge"><span class="k-b">┃</span> MacBook ${OPP[c.side]} ⇄ monitor ${c.mon+1} ${c.side} <span class="ok">crosses</span></div>`).join(''):`<div class="edge wn">✕ MacBook isn't touching the PC. Drag it against an outer edge.</div>`)+
    `<div class="edge muted"><span>│</span> monitor 1 right ⇄ monitor 2 left <span class="faint">inner, moves freely</span></div>`;
  pre.setAttribute('aria-label','Screen layout board. '+(cs.length?cs.map(c=>`MacBook touches the ${c.side} edge of monitor ${c.mon+1}.`).join(' '):'MacBook is not touching the PC.')+' Arrow keys move the selected tile, Space switches tile.');
}
function clampL(){const P=S.L.pc,M=S.L.mac;P.x=Math.max(0,Math.min(BW-26,P.x));P.y=Math.max(0,Math.min(BH-8,P.y));M.x=Math.max(0,Math.min(BW-MW,M.x));M.y=Math.max(0,Math.min(BH-MH-1,M.y));}
function snapL(who){const P=S.L.pc,M=S.L.mac,mons=MON(P);let best=null;
  for(const m of mons){for(const c of [{x:m.x+m.w,y:M.y},{x:m.x-MW,y:M.y},{x:M.x,y:m.y-MH},{x:M.x,y:m.y+m.h}]){
    const d=Math.abs(c.x-M.x)+Math.abs(c.y-M.y);const r={x:c.x,y:c.y,w:MW,h:MH};
    if(d<=3&&!overlapsPC(r)&&contactOf(m,r).length&&(!best||d<best.d))best={...c,d};}}
  if(best&&best.d>0){if(who==='pc'){P.x-=best.x-M.x;P.y-=best.y-M.y;}else{M.x=best.x;M.y=best.y;}}
  clampL();}
function layoutChanged(){drawBoard();resetSim();drawScene(performance.now()/1000);}
let DRAG=null;
function boardCell(e,pre){const r=pre.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*BW,y:(e.clientY-r.top)/r.height*BH};}
function boardDown(e){const pre=e.currentTarget,p=boardCell(e,pre),M=S.L.mac;let who=null;
  if(p.x>=M.x&&p.x<M.x+MW&&p.y>=M.y&&p.y<M.y+MH)who='mac';else if(MON(S.L.pc).some(m=>p.x>=m.x&&p.x<m.x+m.w&&p.y>=m.y&&p.y<m.y+m.h))who='pc';
  if(!who)return;e.preventDefault();pre.setPointerCapture(e.pointerId);pre.classList.add('drag');
  const o=S.L[who];DRAG={who,ox:p.x-o.x,oy:p.y-o.y,start:{...o}};if(S.sel!==who){S.sel=who;$$('[data-act="sel"]').forEach(b=>b.setAttribute('aria-checked',b.dataset.v===who));}drawBoard();}
function boardMove(e){if(!DRAG)return;const pre=e.currentTarget,p=boardCell(e,pre),o=S.L[DRAG.who];
  const nx=Math.round(p.x-DRAG.ox),ny=Math.round(p.y-DRAG.oy);if(nx!==o.x||ny!==o.y){o.x=nx;o.y=ny;clampL();drawBoard();}}
function boardUp(e){if(!DRAG)return;const pre=e.currentTarget;pre.classList.remove('drag');
  const M={x:S.L.mac.x,y:S.L.mac.y,w:MW,h:MH};if(overlapsPC(M)){Object.assign(S.L[DRAG.who],DRAG.start);}else snapL(DRAG.who);
  DRAG=null;layoutChanged();const c=primary();toast(c?`MacBook snapped to the ${c.side} edge of monitor ${c.mon+1}`:'MacBook is not touching the PC');}
function boardKey(e){const d={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key];
  if(e.key===' '||e.key==='Enter'){e.preventDefault();S.sel=S.sel==='mac'?'pc':'mac';$$('[data-act="sel"]').forEach(b=>b.setAttribute('aria-checked',b.dataset.v===S.sel));drawBoard();return;}
  if(!d)return;e.preventDefault();const o=S.L[S.sel],prev={...o};o.x+=d[0];o.y+=d[1];clampL();
  if(overlapsPC({x:S.L.mac.x,y:S.L.mac.y,w:MW,h:MH}))Object.assign(o,prev);layoutChanged();}

/* ---------- live values ---------- */
const LIVE={
  ping:()=>`${S.ping} ms`, link:()=>linkName(), batt:()=>`${S.batt}%`, battbar:()=>bar(S.batt/100,10),
  active:()=>S.active, cursorhere:()=>S.active==='MacBook'?'here now':'on Windows PC',
  pairleft:()=>S.pair?`0:${String(S.pair.left).padStart(2,'0')} left`:'', pairbar:()=>S.pair?'▕'+'█'.repeat(Math.ceil(S.pair.left/4))+'░'.repeat(15-Math.ceil(S.pair.left/4))+'▏':'',
  'lat-mac':()=>latText('mac'), 'lat-pc':()=>latText('pc')
};
function latText(d){const b=ssBase();if(b==null)return 'n/a over Bluetooth';return S.ss.on===d?`${S.ss.lat} ms over ${linkName()}`:`— (≈${b} ms over ${linkName()})`;}
function liveUpdate(){$$('[data-live]').forEach(el=>{const f=LIVE[el.dataset.live];if(f){const v=f();if(el.textContent!==v)el.textContent=v;}});}
function updateLog(){const el=$('#log');if(!el)return;
  el.innerHTML=S.log.slice(-8).map(l=>`<span class="ts">${l.t}</span> ${esc(l.msg).replace(/^(no-cross)/,'<span class="w">$1</span>').replace(/^(cross|arrive)/,'<span class="g">$1</span>')}`).join('\n');}

/* ---------- chrome: nav, status ---------- */
function renderNav(){
  $('#side').innerHTML=box('menu',`<nav aria-label="Sections">${NAV.map(([g,items])=>(g?`<div class="grp" aria-hidden="true"><span>── ${g} </span><span class="fill">${LINE}</span></div>`:'')+items.map(id=>{const p=PAGES[id];
    return `<a class="it" href="#${id}" style="--c:var(${p.acc})" ${S.page===id?'aria-current="page"':''}><span class="m" aria-hidden="true">›</span><span class="g" aria-hidden="true" style="color:var(${p.acc})">${p.g}</span><span>${p.t}</span></a>`;}).join('')).join('')}</nav><div class="hr" aria-hidden="true">${'┈'.repeat(80)}</div><div class="me">this device<br><b>Windows PC</b> · Win 11</div>`,{sq:1});
  $('#crumb').innerHTML=`~/<span>${PAGES[S.page].path}${S.page}</span>`;
  $('#app').classList.toggle('menu',S.menu);$('#menu-btn').setAttribute('aria-expanded',S.menu);
}
function renderStatus(){const sep='<span class="sep" aria-hidden="true">│</span>';
  $('#status').innerHTML=`<span><span class="ok">●</span> <b>2</b> connected</span>${sep}<span>↖ cursor on <b data-live="active"></b>${S.locked?' <span class="wn">(locked)</span>':''}</span>${sep}<span>▤ clipboard <b class="${S.clip?'ok':''}">${S.clip?'on':'off'}</b></span>${sep}<span>≋ <b data-live="link"></b> <span data-live="ping"></span></span>${S.ss.on?`${sep}<span class="k-te">▭ second screen</span>`:''}${S.cam.on?`${sep}<span class="k-ro">◉ camera</span>`:''}${sep}<span class="ok">${lockSvg} encrypted</span><span class="grow"></span><button class="btn" data-act="cmd" style="font-size:12px">${isMac?'⌘':'Ctrl '}K</button>`;
  liveUpdate();}

/* ---------- render ---------- */
const main=$('#main');
function drawScene(t){const pre=$('#scene');if(!pre)return;const f=SCENES[S.page];if(!f)return;const g=new G(+pre.dataset.cols,+pre.dataset.rows);f(g,reduce?2:t);pre.innerHTML=g.html();}
function render(){const fid=document.activeElement&&document.activeElement.id;
  document.documentElement.style.setProperty('--acc',`var(${PAGES[S.page].acc})`);
  main.innerHTML=R[S.page]();renderNav();renderStatus();liveUpdate();updateLog();drawScene(performance.now()/1000);
  const b=$('#board');if(b){drawBoard();b.addEventListener('pointerdown',boardDown);b.addEventListener('pointermove',boardMove);b.addEventListener('pointerup',boardUp);b.addEventListener('pointercancel',boardUp);b.addEventListener('keydown',boardKey);}
  if(fid){const el=document.getElementById(fid);if(el&&el!==document.activeElement)el.focus({preventScroll:true});}}
function go(p){if(location.hash!=='#'+p)location.hash=p;else onHash();}
function onHash(){const p=location.hash.slice(1);if(PAGES[p]&&p!==S.page){S.page=p;S.menu=false;render();window.scrollTo(0,0);const h=$('#main h1');if(h&&!CM.open)h.focus({preventScroll:true});}}
addEventListener('hashchange',onHash);

/* ---------- actions ---------- */
function newPair(){S.pair={code:String(100+Math.floor(Math.random()*900))+' '+String(Math.floor(Math.random()*1000)).padStart(3,'0'),left:60,expired:false};}
function startSS(d){if(S.link==='bt')return 'Switch to Wi-Fi or USB cable first';S.ss.on=d;newLat();return d==='mac'?'Second screen on MacBook started':'Windows PC is now a screen for MacBook';}
function setClip(v){S.clip=v;return v?'Clipboard is on':'Clipboard is off';}
function setMouse(v){S.mouse=v;return v?'Mouse sharing is on':'Mouse sharing is off';}
function setLock(v){S.locked=v;return v?'Cursor locked to this screen':'Cursor unlocked';}
function setCam(v){S.cam.on=v;return v?`Sharing camera from ${S.cam.src}`:'Camera is off';}
function setLink(v){S.link=v;newPing();newLat();if(v==='bt'&&S.ss.on){S.ss.on=null;return 'Bluetooth link: second screen stopped';}return `MacBook link: ${linkName()}`;}
const ACT={
  menu(){S.menu=!S.menu;renderNav();},
  cmd(){openCmd();},
  mouse(){toast(setMouse(!S.mouse));render();},
  lock(){toast(setLock(!S.locked));render();},
  clip(){toast(setClip(!S.clip));render();},
  cam(){toast(setCam(!S.cam.on));render();},
  camsrc(b){S.cam.src=b.dataset.v;toast(S.cam.on?`Camera moved to ${S.cam.src}`:`Camera will run on ${S.cam.src}`);render();},
  link(b){toast(setLink(b.dataset.v));render();},
  pair(){newPair();toast('Pairing code ready');if(S.page!=='connection')go('connection');else render();},
  cancelpair(){S.pair=null;render();},
  ss(b){const d=b.dataset.v;if(S.ss.on===d){S.ss.on=null;toast('Second screen stopped');}else toast(startSS(d));render();},
  res(b){S.ss.res[b.dataset.d]=b.dataset.v;toast(`Resolution ${b.dataset.v}`);render();},
  limit(b){S.clipLimit=b.dataset.v;toast(`Files up to ${S.clipLimit}`);render();},
  mode(b){S.multi=b.dataset.v==='multi';toast(S.multi?'Multi-device mode':'Two-device mode');render();},
  sel(b){S.sel=b.dataset.v;$$('[data-act="sel"]').forEach(x=>x.setAttribute('aria-checked',x.dataset.v===S.sel));drawBoard();},
  boardreset(){S.L=DEFAULT_L();layoutChanged();toast('Layout reset');},
  tipamt(b){S.tip.amt=b.dataset.v;render();if(S.tip.amt==='custom'){const i=$('#tip-custom');i&&i.focus();}},
  tip(){const a=S.tip.amt==='custom'?parseFloat(S.tip.custom):+S.tip.amt;if(!(a>0)){toast('Enter an amount first');const i=$('#tip-custom');i&&i.focus();return;}
    S.tip.done=true;render();toast('Thank you');},
  tipreset(){S.tip.done=false;render();},
  fbtype(b){S.fb.type=b.dataset.v;render();},
  fbsend(){if(!S.fb.msg.trim()){toast('Write a few words first');$('#fb-msg').focus();return;}S.fb.sent=true;render();toast('Feedback saved');},
  fbreset(){S.fb={type:'Idea',msg:'',sys:false,sent:false};render();}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const f=ACT[b.dataset.act];if(f){e.preventDefault();f(b,e);}});
document.addEventListener('click',e=>{const a=e.target.closest('a.it');if(a&&S.menu){S.menu=false;renderNav();}});
document.addEventListener('input',e=>{const el=e.target,k=el.dataset&&el.dataset.in;if(!k)return;
  if(k==='cooldown'){S.cooldown=+el.value;$('#v-cooldown').textContent=S.cooldown+' ms';}
  else if(k==='guard'){S.guard=+el.value;$('#v-guard').textContent=S.guard+' ms';}
  else if(k==='q'){S.ss.q=100-+el.value;$('#v-q').textContent=S.ss.q<40?'favor latency':S.ss.q>60?'favor quality':'balanced';newLat();liveUpdate();}
  else if(k==='tipcustom'){S.tip.custom=el.value.replace(/[^\d.]/g,'').slice(0,6);if(el.value!==S.tip.custom)el.value=S.tip.custom;$('#tip-amt').textContent=S.tip.custom||'…';}
  else if(k==='fbmsg'){S.fb.msg=el.value;}
  else if(k==='fbsys'){S.fb.sys=el.checked;render();}
});

/* ---------- toast ---------- */
let toastT=0;
function toast(m){const el=$('#toast');el.innerHTML=box('done',`<span class="ok">✓</span> ${esc(m)}`);el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),2400);}

/* ---------- command bar ---------- */
const PAGE_ACC=id=>PAGES[id].acc;
function commands(){const c=[
  {l:'Turn on clipboard',h:'clipboard',a:'--am',run:()=>setClip(true)},
  {l:'Turn off clipboard',h:'clipboard',a:'--am',run:()=>setClip(false)},
  {l:'Turn mouse sharing on',h:'mouse',a:'--vi',run:()=>setMouse(true)},
  {l:'Turn mouse sharing off',h:'mouse',a:'--vi',run:()=>setMouse(false)},
  {l:'Lock cursor to this screen',h:'mouse',a:'--vi',run:()=>setLock(true)},
  {l:'Unlock cursor',h:'mouse',a:'--vi',run:()=>setLock(false)},
  {l:'Start second screen on MacBook',h:'screen',a:'--te',run:()=>startSS('mac')},
  {l:'Use Windows PC as a screen for MacBook',h:'screen',a:'--te',run:()=>startSS('pc')},
  {l:'Stop second screen',h:'screen',a:'--te',run:()=>{const w=S.ss.on;S.ss.on=null;return w?'Second screen stopped':'Second screen was not running';}},
  {l:'Share my camera',h:'camera',a:'--ro',run:()=>setCam(true)},
  {l:'Stop sharing my camera',h:'camera',a:'--ro',run:()=>setCam(false)},
  {l:'Pair a new device',h:'connection',a:'--cy',run:()=>{newPair();go('connection');return 'Pairing code ready';}},
  {l:'Switch MacBook link to USB cable',h:'connection',a:'--cy',run:()=>setLink('usb')},
  {l:'Switch MacBook link to Wi-Fi',h:'connection',a:'--cy',run:()=>setLink('wifi')},
  {l:'Switch MacBook link to Bluetooth',h:'connection',a:'--cy',run:()=>setLink('bt')},
  {l:'Turn on multi-device mode',h:'devices',a:'--bl',run:()=>{S.multi=true;return 'Multi-device mode';}},
  {l:'Use two-device mode',h:'devices',a:'--bl',run:()=>{S.multi=false;return 'Two-device mode';}},
  {l:'Reset screen layout',h:'layout',a:'--vi',run:()=>{S.L=DEFAULT_L();resetSim();return 'Layout reset';}}
 ];
 Object.keys(PAGES).forEach(id=>c.push({l:`Go to ${PAGES[id].t}`,h:'go',a:PAGE_ACC(id),run:()=>{go(id);return `Opened ${PAGES[id].t}`;}}));
 return c;}
function fuzzy(q,s){q=q.toLowerCase().trim();const sl=s.toLowerCase();if(!q)return{sc:0,ix:[]};let si=0,sc=0,prev=-2;const ix=[];
  for(const ch of q){if(ch===' ')continue;const i=sl.indexOf(ch,si);if(i<0)return null;sc+=(i===prev+1?3:1)+(i===0||sl[i-1]===' '?2:0);ix.push(i);prev=i;si=i+1;}
  if(sl.includes(q))sc+=12;return{sc:sc-s.length*.01,ix};}
const CM={open:false,sel:0,items:[],opener:null,tt:0};
function hl(s,ix){let o='';[...s].forEach((ch,i)=>{o+=ix.includes(i)?`<em>${esc(ch)}</em>`:esc(ch);});return o;}
function openCmd(){if(CM.open)return;CM.open=true;CM.opener=document.activeElement;const c=$('#cmd');c.hidden=false;c.style.setProperty('--glow','var(--acc)');
  $('#cmdbox').innerHTML=box('command',`<div class="prompt"><span class="ps" aria-hidden="true">omnidesk ❯</span><span class="fld"><input id="q" autocomplete="off" spellcheck="false" placeholder="type a command…" aria-label="Command" role="combobox" aria-expanded="true" aria-controls="cmdlist" aria-autocomplete="list"><span class="caret" id="caret" aria-hidden="true"></span></span></div><ul id="cmdlist" role="listbox" aria-label="Commands"></ul><div class="cmd-foot">↑↓ choose · ↵ run · esc close</div>`,{right:'esc'});
  const q=$('#q');q.addEventListener('input',()=>{CM.sel=0;filterCmd();typingGlow();placeCaret();});
  ['keyup','click','select','scroll'].forEach(ev=>q.addEventListener(ev,placeCaret));
  q.addEventListener('keydown',cmdKey);filterCmd();q.focus();placeCaret();}
function closeCmd(){if(!CM.open)return;CM.open=false;$('#cmd').hidden=true;$('#cmd').classList.remove('typing');$('#cmdbox').innerHTML='';
  if(CM.opener&&document.contains(CM.opener))CM.opener.focus({preventScroll:true});}
function typingGlow(){const c=$('#cmd');c.classList.add('typing');clearTimeout(CM.tt);CM.tt=setTimeout(()=>c.classList.remove('typing'),700);}
function placeCaret(){const q=$('#q'),c=$('#caret');if(!q||!c)return;const pos=q.selectionStart??q.value.length;c.style.left=`calc(${pos}ch - ${q.scrollLeft}px)`;}
function filterCmd(){const q=$('#q').value;CM.items=commands().map(c=>({...c,m:fuzzy(q,c.l)})).filter(c=>c.m).sort((a,b)=>b.m.sc-a.m.sc);
  if(!q.trim())CM.items.sort((a,b)=>(a.h==='go')-(b.h==='go'));
  const ul=$('#cmdlist');
  ul.innerHTML=CM.items.length?CM.items.map((c,i)=>`<li role="option" id="opt-${i}" data-i="${i}" style="--c:var(${c.a})" aria-selected="${i===CM.sel}"><span class="mk" aria-hidden="true">›</span><span class="lb">${hl(c.l,c.m.ix)}</span><span class="hn">${c.h}</span></li>`).join(''):'<li aria-disabled="true"><span class="lb faint">no matching command</span></li>';
  const cur=CM.items[CM.sel];$('#cmd').style.setProperty('--glow',cur?`var(${cur.a})`:'var(--acc)');
  $('#q').setAttribute('aria-activedescendant',cur?'opt-'+CM.sel:'');
  const li=$('#opt-'+CM.sel);li&&li.scrollIntoView({block:'nearest'});}
function runCmd(i){const c=CM.items[i];if(!c)return;closeCmd();const msg=c.run();render();if(msg)toast(msg);}
function cmdKey(e){
  if(e.key==='ArrowDown'){e.preventDefault();CM.sel=Math.min(CM.items.length-1,CM.sel+1);filterCmd();}
  else if(e.key==='ArrowUp'){e.preventDefault();CM.sel=Math.max(0,CM.sel-1);filterCmd();}
  else if(e.key==='Enter'){e.preventDefault();runCmd(CM.sel);}
  else if(e.key==='Tab'){e.preventDefault();}
  else if(e.key==='Escape'){e.preventDefault();closeCmd();}
  else if(e.key.length===1)typingGlow();}
$('#cmd').addEventListener('click',e=>{const li=e.target.closest('li[data-i]');if(li){runCmd(+li.dataset.i);return;}if(e.target.id==='cmd')closeCmd();});
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();CM.open?closeCmd():openCmd();return;}
  if(e.key==='Escape'){if(CM.open)closeCmd();else if(S.menu){S.menu=false;renderNav();}}
  if(e.ctrlKey&&e.altKey&&e.key.toLowerCase()==='l'){e.preventDefault();toast(setLock(!S.locked));render();}
});
$('#kbd-hint').textContent=isMac?'⌘K':'Ctrl K';

/* ---------- spectral character field (background) ---------- */
const cv=$('#field'),fx=cv.getContext('2d');let FW=0,FH=0,FC=0,FR=0;const CW=11,CH=18,RAMP=' ·∙░▒▓';
function sizeField(){const d=Math.min(window.devicePixelRatio||1,2);FW=innerWidth;FH=innerHeight;cv.width=FW*d;cv.height=FH*d;fx.setTransform(d,0,0,d,0,0);FC=Math.ceil(FW/CW);FR=Math.ceil(FH/CH);fx.textBaseline='top';drawField(performance.now()/1000);}
function drawField(t){fx.clearRect(0,0,FW,FH);fx.font='12px "JetBrains Mono", ui-monospace, Menlo, monospace';
  for(let y=0;y<FR;y++)for(let x=0;x<FC;x++){
    const n=Math.sin(x*.09+t*.06)+Math.sin(y*.16-t*.045)+Math.sin((x+y)*.05+t*.035)+Math.sin(Math.hypot(x-FC*.7,y-FR*.3)*.11-t*.08);
    const v=(n+4)/8,idx=Math.floor(Math.pow(v,2.3)*5.6);if(idx<=0)continue;
    const hue=(185+x/FC*250+y/FR*40+t*3)%360;
    fx.fillStyle=`hsla(${hue|0},46%,64%,${(.05+v*.17).toFixed(3)})`;fx.fillText(RAMP[Math.min(5,idx)],x*CW,y*CH);}}
addEventListener('resize',sizeField);

/* ---------- loops ---------- */
let last=performance.now(),lastScene=0,lastField=0;
function loop(now){const dt=Math.min(.1,(now-last)/1000);last=now;const t=now/1000;
  if(!reduce){simStep(dt);if(now-lastScene>85){lastScene=now;drawScene(t);}if(now-lastField>170){lastField=now;drawField(t);}}
  requestAnimationFrame(loop);}
let sec=0;
setInterval(()=>{sec++;newPing();if(S.ss.on)newLat();if(sec%30===0&&S.batt>5)S.batt--;
  if(S.pair&&!S.pair.expired){S.pair.left--;if(S.pair.left<=0){S.pair.expired=true;if(S.page==='connection')render();}}
  liveUpdate();if(reduce)drawScene(2);},1000);
RM.addEventListener&&RM.addEventListener('change',e=>{reduce=e.matches;drawField(performance.now()/1000);render();});

/* ---------- boot ---------- */
(function boot(){const now=Date.now();
  addLog('no-cross reason=not-outer-edge edge=right pos=(2559,812) monitors=[0,0,2560x1440][2560,180,1920x1080]','w',new Date(now-41000));
  addLog('cross to=MacBook edge=right pos=(4479,640) cooldown=250ms','g',new Date(now-38000));
  addLog('arrive MacBook pos=(0,460) guard=150ms','g',new Date(now-37800));
  addLog('no-cross reason=button-held edge=left pos=(0,512)','w',new Date(now-22000));
  addLog('cross to=Windows PC edge=left pos=(0,498) cooldown=250ms','g',new Date(now-19000));
  const p=location.hash.slice(1);if(PAGES[p])S.page=p;
  resetSim();sizeField();render();requestAnimationFrame(loop);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>drawField(performance.now()/1000));
})();
</script>
