<title>OmniDesk · Glass folders</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
@import url('https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

:root{
  color-scheme:dark;
  --bg:#0a0c11;
  --ink:#eef1f6; --ink-2:#b6bdcb; --ink-3:#808999; --ink-4:#596170;
  --line:rgba(255,255,255,.07); --line-2:rgba(255,255,255,.13);
  --glass:rgba(22,26,36,.5); --glass-front:rgba(25,29,40,.74); --glass-cmd:rgba(24,28,38,.86);
  --paper:#d7dbe3; --paper-2:#adb3bf; --paper-cut:#1a1e27;
  --c-home:#c9d2e3; --c-conn:#5fd4e8; --c-mouse:#a98bff; --c-clip:#f2b860; --c-screen:#52d6aa;
  --c-cam:#f483a6; --c-multi:#6fa6ff; --c-tip:#eba97c; --c-fb:#9fb3cf; --c-about:#c3b8ff;
  --good:#6edc9c; --warn:#f3c96b; --bad:#f47b7b;
  --focus:#a9cbff;
  --font:"Figtree","Instrument Sans","Hanken Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --ease:cubic-bezier(.22,.8,.24,1);
  --spec:linear-gradient(90deg,#5fd4e8,#a98bff,#f483a6,#f2b860,#52d6aa,#6fa6ff,#5fd4e8);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
a{color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.muted{color:var(--ink-3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- spectral light through frosted glass ---------- */
.spectrum{position:fixed;inset:-25%;z-index:0;pointer-events:none;
  background:
    radial-gradient(38% 30% at 22% 28%,rgba(95,212,232,.30),transparent 70%),
    radial-gradient(34% 32% at 74% 22%,rgba(169,139,255,.30),transparent 70%),
    radial-gradient(40% 34% at 64% 78%,rgba(82,214,170,.22),transparent 70%),
    radial-gradient(30% 26% at 30% 80%,rgba(244,131,166,.20),transparent 70%),
    radial-gradient(26% 22% at 88% 60%,rgba(242,184,96,.16),transparent 70%);
  filter:blur(40px) saturate(115%);
  animation:drift 90s ease-in-out infinite alternate}
.frost{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(10,12,17,.10),rgba(10,12,17,.42)),
  repeating-linear-gradient(115deg,rgba(255,255,255,.012) 0 2px,transparent 2px 7px)}
@keyframes drift{
  0%{transform:translate3d(0,0,0) rotate(0) scale(1);filter:blur(40px) hue-rotate(0deg)}
  50%{transform:translate3d(4%,-3%,0) rotate(8deg) scale(1.06);filter:blur(46px) hue-rotate(25deg)}
  100%{transform:translate3d(-3%,4%,0) rotate(-6deg) scale(1.02);filter:blur(40px) hue-rotate(-20deg)}}

/* ---------- app frame ---------- */
.app{position:relative;z-index:1;height:100vh;height:100dvh;display:grid;
  grid-template-columns:244px minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;column-gap:22px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* sidebar */
.side{grid-row:1;grid-column:1;overflow-y:auto;padding:20px 2px 18px;display:flex;flex-direction:column;gap:20px;scrollbar-width:thin}
.brand{display:flex;align-items:center;gap:11px;padding:2px 8px 4px;text-decoration:none}
.brand svg{width:34px;height:34px;flex:none}
.brand b{display:block;font-size:16px;font-weight:650;letter-spacing:-.01em}
.brand small{display:block;font-size:11.5px;color:var(--ink-3);line-height:1.3}
#nav{display:grid;gap:18px}
.navg h2{margin:0 0 6px;padding:0 10px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-4)}
.navg ul{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.nav-i{position:relative;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;color:var(--ink-2);text-decoration:none;font-weight:500;transition:background .25s,color .25s}
.nav-i svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.nav-i:hover{background:rgba(255,255,255,.04);color:var(--ink)}
.nav-i[aria-current=page]{background:rgba(255,255,255,.07);color:var(--ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.nav-i[aria-current=page]::before{content:"";position:absolute;left:-2px;top:9px;bottom:9px;width:3px;border-radius:3px;background:var(--a);box-shadow:0 0 10px var(--a)}
.nav-i[aria-current=page] svg{color:var(--a);opacity:1}
.nav-i .st{margin-left:auto;width:6px;height:6px;border-radius:50%;background:var(--a);box-shadow:0 0 8px var(--a)}
.nav-i .st.off{background:transparent;box-shadow:inset 0 0 0 1px var(--ink-4)}
.side-foot{margin-top:auto;padding:12px;border-radius:14px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);font-size:12.5px;color:var(--ink-3)}
.side-foot b{color:var(--ink-2);font-weight:600}

/* main */
.main{grid-row:1;grid-column:2;min-width:0;overflow-y:auto;overflow-x:hidden;padding:16px 0 30px;scrollbar-width:thin}
.mainbar{display:flex;align-items:center;gap:12px;margin-bottom:12px;min-width:0}
.crumb{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-3);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb i{width:7px;height:7px;border-radius:50%;background:var(--a);box-shadow:0 0 10px var(--a);flex:none}
.crumb b{color:var(--ink-2);font-weight:500}
.menu-btn{display:none}
.icon-btn{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:11px;border:1px solid var(--line-2);background:var(--glass);cursor:pointer;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.icon-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round}
.cmd-btn{margin-left:auto;display:flex;align-items:center;gap:10px;min-width:0;padding:8px 10px 8px 13px;border-radius:12px;border:1px solid var(--line-2);background:var(--glass);color:var(--ink-3);cursor:pointer;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);transition:border-color .25s,color .25s}
.cmd-btn:hover{color:var(--ink-2);border-color:rgba(255,255,255,.2)}
.cmd-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;flex:none}
.cmd-btn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
kbd{font-family:var(--mono);font-size:11px;padding:2px 6px;border-radius:6px;background:rgba(255,255,255,.06);border:1px solid var(--line-2);color:var(--ink-2);white-space:nowrap}

/* ---------- folder tabs ---------- */
.tabs-wrap{position:relative;z-index:4;overflow-x:auto;overflow-y:hidden;margin-bottom:-1px;scrollbar-width:none;-ms-overflow-style:none}
.tabs-wrap::-webkit-scrollbar{display:none}
.tabs{display:flex;align-items:flex-end;gap:3px;padding:0 10px;width:max-content;min-width:100%}
.tab{position:relative;display:flex;align-items:center;gap:7px;margin-top:7px;padding:8px 13px 9px;border-radius:12px 12px 0 0;
  border:1px solid var(--line);border-bottom:0;background:rgba(22,26,36,.42);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  color:var(--ink-3);font-size:12.5px;font-weight:500;text-decoration:none;white-space:nowrap;
  transition:margin .35s var(--ease),padding .35s var(--ease),background .35s,color .3s}
.tab::before{content:"";position:absolute;left:9px;right:9px;top:-1px;height:2px;border-radius:2px;background:var(--a);opacity:.45;transition:opacity .3s,box-shadow .3s}
.tab:hover{color:var(--ink-2);background:rgba(30,34,46,.55)}
.tab[aria-current=page]{margin-top:0;padding:10px 15px 14px;background:var(--glass-front);color:var(--ink);border-color:var(--line-2)}
.tab[aria-current=page]::before{opacity:1;box-shadow:0 0 12px var(--a)}

/* ---------- the stack of glass folders ---------- */
.stack{position:relative;z-index:3}
.sheet{position:relative;z-index:3;border-radius:6px 20px 20px 20px;padding:24px;
  background:linear-gradient(180deg,color-mix(in oklab,var(--a) 7%,transparent),transparent 180px),var(--glass-front);
  backdrop-filter:blur(26px) saturate(135%);-webkit-backdrop-filter:blur(26px) saturate(135%);
  border:1px solid var(--line-2);
  box-shadow:0 40px 80px -30px rgba(0,0,0,.75),0 2px 0 rgba(255,255,255,.02),inset 0 1px 0 rgba(255,255,255,.07);
  transform-origin:50% 0;
  transition:transform .38s var(--ease),filter .38s var(--ease),opacity .38s var(--ease)}
.sheet.back{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden;
  border-top:2px solid color-mix(in oklab,var(--a) 70%,transparent);
  box-shadow:0 -6px 18px -8px color-mix(in oklab,var(--a) 55%,transparent);
  transform:translateY(-16px) scale(.975);filter:blur(.8px) brightness(.9)}
.sheet.back.back2{z-index:0;transform:translateY(-30px) scale(.95);filter:blur(1.6px) brightness(.68)}
.sheet.enter{animation:sheetIn .38s var(--ease)}
@keyframes sheetIn{from{transform:translateY(28px) scale(.985);opacity:.4;filter:blur(2px)}to{transform:none;opacity:1;filter:none}}

/* live header */
.lh{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,360px);gap:24px;align-items:center;padding-bottom:22px;margin-bottom:22px;border-bottom:1px solid var(--line)}
.kick{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--a)}
.kick i{width:7px;height:7px;border-radius:50%;background:var(--a);box-shadow:0 0 0 0 var(--a);animation:beat 2.6s ease-out infinite}
@keyframes beat{0%{box-shadow:0 0 0 0 color-mix(in oklab,var(--a) 60%,transparent)}70%,100%{box-shadow:0 0 0 9px transparent}}
.lh h1{margin:6px 0 4px;font-size:27px;line-height:1.15;font-weight:650;letter-spacing:-.02em}
.lh .sub{margin:0;color:var(--ink-2);max-width:52ch}
.stats{display:flex;flex-wrap:wrap;gap:10px 26px;margin:16px 0 0}
.stats div{min-width:0}
.stats dt{font-size:11px;color:var(--ink-3);letter-spacing:.04em;text-transform:uppercase}
.stats dd{margin:2px 0 0;font-size:19px;font-weight:600}
.stats dd .u{font-size:12px;color:var(--ink-3);font-weight:500;margin-left:2px}
.lh-scene{min-width:0}
.lh-scene svg{display:block;width:100%;height:auto;max-height:170px;overflow:visible}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600;letter-spacing:.02em;color:var(--a);background:color-mix(in oklab,var(--a) 14%,transparent);border:1px solid color-mix(in oklab,var(--a) 35%,transparent);vertical-align:middle;margin-left:8px}

/* paper cut-out device kit */
.cut{filter:drop-shadow(0 2px 0 rgba(0,0,0,.5)) drop-shadow(0 10px 12px rgba(0,0,0,.38))}
.acc{stroke:var(--a);fill:none}
.accf{fill:var(--a)}
.lbl{font:500 9.5px var(--font);fill:var(--ink-3);letter-spacing:.02em}

/* scene animation */
.travel{animation:travel 2.6s ease-in-out infinite alternate}
@keyframes travel{to{transform:translateX(44px)}}
.sweep{transform-origin:110px 80px;animation:spin 4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.blip{transform-box:fill-box;transform-origin:center;animation:blip 4s ease-out infinite}
@keyframes blip{0%{opacity:1;transform:scale(1.8)}25%{opacity:.95;transform:scale(1)}100%{opacity:.35;transform:scale(1)}}
.edge-pulse{animation:edgep 2.8s ease-in-out infinite}
@keyframes edgep{0%,100%{opacity:.35}50%{opacity:1}}
.fly{animation:fly 6.5s var(--ease) infinite}
@keyframes fly{0%,14%{transform:translate(0,0) rotate(0)}52%{transform:translate(110px,-36px) rotate(7deg)}86%,100%{transform:translate(218px,-8px) rotate(0)}}
.slide-disp{transform-box:fill-box;transform-origin:0 0;animation:slided 8s var(--ease) infinite}
@keyframes slided{0%,14%{transform:none}50%,86%{transform:translate(214px,25px) scale(.79,.83)}100%{transform:none}}
.ring{transform-box:fill-box;transform-origin:center;animation:ring 3.6s ease-out infinite}
@keyframes ring{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.7);opacity:0}}
.flow{stroke-dasharray:4 6;animation:flow 1.6s linear infinite}
@keyframes flow{to{stroke-dashoffset:-20}}
.coin{animation:coin 7.5s cubic-bezier(.5,0,.7,1) infinite}
@keyframes coin{0%{transform:translateY(-40px);opacity:0}8%{opacity:1}30%,100%{transform:translateY(62px);opacity:0}}
.plane{animation:plane 10s ease-in-out infinite alternate}
@keyframes plane{0%{transform:translate(30px,78px) rotate(-6deg)}50%{transform:translate(160px,38px) rotate(-14deg)}100%{transform:translate(290px,66px) rotate(5deg)}}
.slowspin{transform-box:fill-box;transform-origin:center;animation:spin 24s linear infinite}
.paused,.paused *{animation-play-state:paused!important}
.dim{opacity:.38}

/* map */
.map .scr{fill:rgba(255,255,255,.035);stroke:rgba(255,255,255,.22);stroke-width:1}
.map .scr.mac{transition:fill .3s,stroke .3s}
.map .scr.on{fill:color-mix(in oklab,var(--a) 14%,transparent);stroke:var(--a)}
.map .outer{stroke:var(--a);stroke-width:2.5;stroke-linecap:round;filter:drop-shadow(0 0 4px var(--a))}
.map .cur{fill:#fff;stroke:#111;stroke-width:1;filter:drop-shadow(0 2px 3px rgba(0,0,0,.6))}

/* building blocks */
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.stackv{display:grid;gap:16px}
.card{position:relative;min-width:0;border-radius:16px;padding:18px;background:rgba(255,255,255,.028);border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.035)}
.card h2,.card h3{margin:0 0 4px;font-size:15px;font-weight:600;letter-spacing:-.005em}
.card p{margin:0}
.card .hint{font-size:12.5px;color:var(--ink-3);margin-top:4px}
.row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0;border-top:1px solid var(--line);min-width:0}
.row:first-of-type{border-top:0}
.row > div:first-child{min-width:0}
.row b{font-weight:600}
.row .d{font-size:12.5px;color:var(--ink-3)}
.sw{flex:none;position:relative;width:42px;height:24px;border-radius:99px;border:1px solid var(--line-2);background:rgba(255,255,255,.08);cursor:pointer;padding:0;transition:background .3s,border-color .3s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#e9edf3;box-shadow:0 2px 4px rgba(0,0,0,.4);transition:transform .3s var(--ease)}
.sw[aria-checked=true]{background:color-mix(in oklab,var(--a) 70%,#000 10%);border-color:transparent}
.sw[aria-checked=true]::after{transform:translateX(18px)}
.sw.big{width:54px;height:30px}.sw.big::after{width:24px;height:24px}.sw.big[aria-checked=true]::after{transform:translateX(24px)}
.seg{display:inline-flex;flex-wrap:wrap;gap:2px;padding:3px;border-radius:11px;background:rgba(0,0,0,.22);border:1px solid var(--line);max-width:100%}
.seg button{border:0;background:transparent;color:var(--ink-3);padding:6px 11px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;transition:background .25s,color .25s}
.seg button svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.seg button:hover{color:var(--ink-2)}
.seg button[aria-pressed=true]{background:rgba(255,255,255,.1);color:var(--ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 15px;border-radius:11px;border:1px solid var(--line-2);background:rgba(255,255,255,.05);color:var(--ink);font-weight:500;cursor:pointer;text-decoration:none;transition:background .25s,border-color .25s}
.btn:hover{background:rgba(255,255,255,.09)}
.btn.pri{background:color-mix(in oklab,var(--a) 24%,transparent);border-color:color-mix(in oklab,var(--a) 55%,transparent)}
.btn.pri:hover{background:color-mix(in oklab,var(--a) 34%,transparent)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:9px}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:99px;font-size:12px;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.chip i{width:6px;height:6px;border-radius:50%;background:var(--c,var(--a))}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ink-2)}
.pill i{width:7px;height:7px;border-radius:50%}
.good{color:var(--good)} .warn{color:var(--warn)} .bad{color:var(--bad)}
.dot-good{background:var(--good);box-shadow:0 0 8px var(--good)} .dot-off{background:var(--ink-4)} .dot-warn{background:var(--warn)}
input[type=range]{width:100%;accent-color:var(--a);margin:8px 0 2px}
.range-l{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-3)}
.note{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:14px;background:color-mix(in oklab,var(--a) 7%,transparent);border:1px solid color-mix(in oklab,var(--a) 22%,transparent)}
.note svg{width:20px;height:20px;flex:none;stroke:var(--a);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;margin-top:1px}
.note p{margin:0}
.note small{color:var(--ink-3);font-size:12.5px}
.sect{margin:26px 0 10px;font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.sect:first-child{margin-top:0}

/* devices */
.dev{display:flex;flex-direction:column;gap:14px}
.dev-art{height:92px;display:grid;place-items:center;border-radius:12px;background:radial-gradient(70% 90% at 50% 100%,rgba(255,255,255,.05),transparent)}
.dev-art svg{height:78px;width:auto;max-width:100%;overflow:visible}
.dev.off .dev-art svg{opacity:.4}
.dev h3{display:flex;align-items:center;flex-wrap:wrap;gap:8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:10px 0 0;font-size:13px}
.kv dt{color:var(--ink-3)} .kv dd{margin:0;min-width:0}
.batt{display:inline-flex;align-items:center;gap:7px}
.batt-b{position:relative;width:24px;height:11px;border-radius:3px;border:1.5px solid var(--ink-3)}
.batt-b::after{content:"";position:absolute;right:-4px;top:2.5px;width:2px;height:4px;border-radius:1px;background:var(--ink-3)}
.batt-b i{position:absolute;left:1px;top:1px;bottom:1px;border-radius:1px;background:var(--good)}
.share-now{margin-top:auto;padding-top:12px;border-top:1px solid var(--line)}
.share-now .t{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-4);margin-bottom:7px}
.qa{display:flex;flex-wrap:wrap;gap:8px}

/* pairing */
.code{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.code span{display:grid;place-items:center;width:40px;height:50px;border-radius:10px;font:500 26px var(--mono);background:rgba(0,0,0,.3);border:1px solid color-mix(in oklab,var(--a) 35%,transparent);color:var(--ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.code span:nth-child(3){margin-right:10px}
.cd{display:flex;align-items:center;gap:12px}
.cd svg{width:46px;height:46px;transform:rotate(-90deg)}
.cd circle{fill:none;stroke-width:3}
.cd .tr{stroke:rgba(255,255,255,.08)} .cd .pr{stroke:var(--a);stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.linkrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.linkrow:first-of-type{border-top:0}
.linkrow svg.mini{width:58px;height:36px;overflow:visible}
.linkrow .ctl{grid-column:2 / -1}

/* log */
.log{margin:0;padding:12px 14px;border-radius:12px;background:rgba(0,0,0,.34);border:1px solid var(--line);font:11.5px/1.65 var(--mono);color:var(--ink-2);white-space:pre;max-height:220px;overflow:auto}
.log .ok{color:var(--good)} .log .no{color:var(--warn)} .log .ts{color:var(--ink-4)}
.rule{display:flex;gap:12px;align-items:center}
.rule svg{width:18px;height:18px;stroke:var(--ink-3);fill:none;stroke-width:1.7;flex:none}

/* layout canvas */
.lay{position:relative;width:100%;aspect-ratio:96/46;border-radius:14px;overflow:hidden;touch-action:none;
  background:radial-gradient(60% 70% at 50% 50%,rgba(255,255,255,.035),transparent),
  repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 24px),
  repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 1px,transparent 1px 24px),rgba(0,0,0,.25);
  border:1px solid var(--line)}
.tile{position:absolute;cursor:grab;touch-action:none;border-radius:6px;transition:left .3s var(--ease),top .3s var(--ease)}
.tile.drag{cursor:grabbing;transition:none;z-index:3}
.tile .m{position:absolute;border-radius:5px;background:rgba(215,219,227,.12);border:1.5px solid rgba(215,219,227,.55);box-shadow:0 8px 18px rgba(0,0,0,.4);display:flex;align-items:flex-start;padding:4px 6px;overflow:hidden}
.tile .m span{font-size:11px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.tile[data-tile=mac] .m{background:color-mix(in oklab,var(--a) 14%,rgba(215,219,227,.08));border-color:color-mix(in oklab,var(--a) 60%,rgba(215,219,227,.4))}
.tile[data-tile=pc]{outline:1px dashed rgba(215,219,227,.28);outline-offset:6px}
.tile:focus-visible{outline-offset:4px}
.edgeline{position:absolute;background:var(--a);border-radius:3px;box-shadow:0 0 10px var(--a),0 0 2px var(--a);pointer-events:none;z-index:4}
.edges{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:6px;font-size:13px}
.edges li{display:flex;gap:8px;align-items:center}
.edges li::before{content:"";width:14px;height:3px;border-radius:2px;background:var(--a);box-shadow:0 0 6px var(--a);flex:none}
.edges li.none::before{background:var(--warn);box-shadow:none}

/* clipboard */
.clips{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.clip{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px;border-radius:14px;background:rgba(255,255,255,.025);border:1px solid var(--line)}
.clip .ic{width:52px;height:40px;border-radius:9px;display:grid;place-items:center;background:rgba(0,0,0,.3);border:1px solid var(--line);overflow:hidden}
.clip .ic svg{width:22px;height:22px;stroke:var(--a);fill:none;stroke-width:1.6;stroke-linejoin:round}
.clip .ic svg.thumb{width:52px;height:40px;stroke:none}
.clip b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clip small{color:var(--ink-3);font-size:12px}
.dir{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);white-space:nowrap}
.dir svg{width:14px;height:14px;stroke:var(--a);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.off-veil{opacity:.5}

/* second screen */
.ssc .art{height:84px;display:grid;place-items:center;margin-bottom:12px}
.ssc .art svg{height:76px;width:auto;max-width:100%;overflow:visible}
.ssc.on{border-color:color-mix(in oklab,var(--a) 50%,transparent);box-shadow:0 0 0 1px color-mix(in oklab,var(--a) 25%,transparent),0 20px 50px -25px color-mix(in oklab,var(--a) 50%,transparent)}
.lat{display:flex;align-items:baseline;gap:6px;font-size:34px;font-weight:600}
.lat .u{font-size:14px;color:var(--ink-3);font-weight:500}

/* camera */
.camsel{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.camsel button{display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left;padding:14px;border-radius:13px;border:1px solid var(--line);background:rgba(255,255,255,.025);cursor:pointer;color:var(--ink-2)}
.camsel button[aria-checked=true]{border-color:color-mix(in oklab,var(--a) 60%,transparent);background:color-mix(in oklab,var(--a) 9%,transparent);color:var(--ink)}
.camsel svg{height:40px;width:auto}
.watch{list-style:none;margin:0;padding:0}
.watch li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.watch li:first-child{border-top:0}

/* tip & feedback */
.amts{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}
.amts button{min-width:74px;padding:14px 16px;border-radius:14px;border:1px solid var(--line-2);background:rgba(255,255,255,.035);cursor:pointer;font:600 20px var(--mono)}
.amts button[aria-pressed=true]{border-color:color-mix(in oklab,var(--a) 70%,transparent);background:color-mix(in oklab,var(--a) 14%,transparent);box-shadow:0 0 22px -6px var(--a)}
.field{display:grid;gap:6px;margin-top:14px}
.field label,.field .lab{font-size:12.5px;color:var(--ink-3)}
.inp{width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--line-2);background:rgba(0,0,0,.28);color:var(--ink);outline:none;transition:border-color .25s,box-shadow .25s}
.inp:focus{border-color:color-mix(in oklab,var(--a) 70%,transparent);box-shadow:0 0 0 3px color-mix(in oklab,var(--a) 18%,transparent)}
textarea.inp{min-height:120px;resize:vertical;line-height:1.5}
.money{position:relative;max-width:180px}
.money span{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--ink-3);font-family:var(--mono)}
.money .inp{padding-left:26px;font-family:var(--mono)}
.check{display:flex;gap:10px;align-items:flex-start;margin-top:16px;cursor:pointer}
.check input{width:18px;height:18px;margin:1px 0 0;accent-color:var(--a)}
.sysinfo{margin:12px 0 0;padding:12px 14px;border-radius:12px;background:rgba(0,0,0,.3);border:1px dashed var(--line-2);font:12px/1.7 var(--mono);color:var(--ink-2);white-space:pre-wrap;word-break:break-word}
.err{color:var(--bad);font-size:12.5px;margin-top:6px}
.thanks{text-align:center;padding:30px 18px}
.thanks svg{width:70px;height:70px}
.thanks h2{font-size:22px;margin:12px 0 6px}

/* about */
.about-top{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.about-top svg{width:64px;height:64px}
.credits{font-size:13.5px;line-height:1.7;color:var(--ink-2)}
.credits p{margin:0 0 10px}

/* status bar */
.status{grid-column:1 / -1;grid-row:2;min-width:0;overflow-x:auto;scrollbar-width:none;padding:0 0 max(10px,env(safe-area-inset-bottom,0px))}
.status::-webkit-scrollbar{display:none}
.status-in{display:flex;align-items:center;gap:6px;width:max-content;min-width:100%;padding:7px 8px;border-radius:14px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);font-size:12.5px;color:var(--ink-3)}
.sb{display:inline-flex;align-items:center;gap:7px;padding:3px 10px;border-radius:9px;white-space:nowrap}
.sb + .sb{border-left:1px solid var(--line);border-radius:0}
.sb b{color:var(--ink);font-weight:600}
.sb svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sb i{width:7px;height:7px;border-radius:50%}
.sb.right{margin-left:auto}

/* command bar: a glass sheet that drops down */
.cmd-scrim{position:fixed;inset:0;z-index:100;display:flex;justify-content:center;align-items:flex-start;padding:0 16px;background:rgba(5,7,11,.42);opacity:0;transition:opacity .3s}
.cmd-scrim.open{opacity:1}
.cmd{position:relative;width:min(640px,100%);border-radius:0 0 22px 22px;background:var(--glass-cmd);backdrop-filter:blur(32px) saturate(150%);-webkit-backdrop-filter:blur(32px) saturate(150%);
  border:1px solid var(--line-2);border-top:0;box-shadow:0 50px 90px -30px rgba(0,0,0,.8),inset 0 -1px 0 rgba(255,255,255,.05);
  transform:translateY(-105%);transition:transform .4s var(--ease);padding-top:env(safe-area-inset-top,0px)}
.cmd-scrim.open .cmd{transform:none}
.cmd::before{content:"";position:absolute;inset:0 -1px -1px;border-radius:inherit;padding:0 1.5px 1.5px;background:var(--spec);background-size:300% 100%;
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:.18;transition:opacity .35s;pointer-events:none}
.cmd::after{content:"";position:absolute;left:8%;right:8%;bottom:-16px;height:30px;background:var(--spec);background-size:300% 100%;filter:blur(22px);opacity:0;transition:opacity .35s;pointer-events:none;z-index:-1}
.cmd.typing::before{opacity:1;animation:specslide 3s linear infinite}
.cmd.typing::after{opacity:.5;animation:specslide 3s linear infinite}
@keyframes specslide{to{background-position:300% 0}}
.cmd-in{display:flex;align-items:center;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line)}
.cmd-in svg{width:20px;height:20px;stroke:var(--ink-3);fill:none;stroke-width:1.8;stroke-linecap:round;flex:none}
.cmd-in input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:18px;color:var(--ink)}
.cmd-in input::placeholder{color:var(--ink-4)}
.cmd ul{list-style:none;margin:0;padding:8px;max-height:min(52vh,420px);overflow-y:auto}
.cmd li{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;cursor:pointer;color:var(--ink-2)}
.cmd li .ci{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:color-mix(in oklab,var(--a) 16%,transparent);flex:none}
.cmd li .ci svg{width:15px;height:15px;stroke:var(--a);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cmd li .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmd li mark{background:none;color:var(--ink);font-weight:650}
.cmd li .k{font-size:11px;color:var(--ink-4)}
.cmd li[aria-selected=true]{background:rgba(255,255,255,.07);color:var(--ink)}
.cmd li[aria-selected=true] .k{color:var(--ink-3)}
.cmd .empty{padding:18px 14px;color:var(--ink-3)}
.cmd-foot{display:flex;gap:14px;flex-wrap:wrap;padding:10px 18px 14px;border-top:1px solid var(--line);font-size:11.5px;color:var(--ink-4)}

/* toast */
.toast{position:fixed;z-index:120;right:max(16px,env(safe-area-inset-right,0px));bottom:76px;max-width:calc(100vw - 32px);display:flex;align-items:center;gap:10px;padding:11px 16px;border-radius:14px;background:var(--glass-cmd);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--line-2);box-shadow:0 20px 40px -10px rgba(0,0,0,.6);transform:translateY(14px);opacity:0;pointer-events:none;transition:transform .35s var(--ease),opacity .35s}
.toast.show{transform:none;opacity:1}
.toast i{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 8px var(--good)}

.drawer-scrim{display:none}

/* ---------- narrower ---------- */
@media (max-width:1080px){
  .lh{grid-template-columns:minmax(0,1fr)}
  .lh-scene{max-width:420px}
  .grid3{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr);column-gap:0}
  .main{grid-column:1}
  .side{position:fixed;z-index:60;top:0;bottom:0;left:0;width:min(300px,86vw);padding:20px 14px 20px max(16px,env(safe-area-inset-left,0px));
    background:rgba(13,16,22,.94);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-right:1px solid var(--line-2);
    transform:translateX(-105%);transition:transform .35s var(--ease);visibility:hidden}
  .app.drawer .side{transform:none;visibility:visible}
  .drawer-scrim{display:block;position:fixed;inset:0;z-index:55;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .3s}
  .app.drawer .drawer-scrim{opacity:1;pointer-events:auto}
  .menu-btn{display:inline-grid}
  .grid2,.grid3{grid-template-columns:minmax(0,1fr)}
  .sheet{padding:18px 16px;border-radius:6px 16px 16px 16px}
  .lh h1{font-size:23px}
  .cmd-btn .lab-long{display:none}
}
@media (min-width:821px){.cmd-btn .lab-short{display:none}}
@media (max-width:480px){
  .camsel{grid-template-columns:minmax(0,1fr)}
  .clip{grid-template-columns:44px minmax(0,1fr)}
  .clip .ic{width:44px}
  .clip .dir{grid-column:2}
  .linkrow{grid-template-columns:auto minmax(0,1fr)}
  .linkrow > :nth-child(3){grid-column:2}
  .code span{width:34px;height:44px;font-size:22px}
  .toast{bottom:70px}
}

/* ---------- reduced motion ---------- */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .spectrum{animation:none!important}
}

/* ---------- nav, tabs, status ---------- */
function buildNav(){
  const groups=[['',['home']],['Share',['mouse','layout','clipboard','screen','camera']],['Devices',['connection','devices']],['More',['tip','feedback','about']]];
  $('#nav').innerHTML=groups.map(g=>`<div class="navg">${g[0]?`<h2>${g[0]}</h2>`:''}<ul>${g[1].map(id=>{const p=P(id);return `<li><a class="nav-i" href="#${id}" data-nav="${id}" style="--a:${p.accent}">${ic(p.icon)}<span>${p.label}</span><span class="st" data-st="${id}" hidden></span></a></li>`}).join('')}</ul></div>`).join('');
  $('#tabs').innerHTML=PAGES.map(p=>`<a class="tab" href="#${p.id}" data-tab="${p.id}" style="--a:${p.accent}">${p.tab}</a>`).join('');
}
function navState(){
  $$('[data-nav]').forEach(a=>{a.toggleAttribute('aria-current',a.dataset.nav===S.page);if(a.dataset.nav===S.page)a.setAttribute('aria-current','page')});
  $$('[data-tab]').forEach(a=>{if(a.dataset.tab===S.page)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  const st={mouse:S.mouse&&!S.locked,clipboard:S.clip,screen:!!S.ss.on,camera:S.cam.on};
  $$('[data-st]').forEach(e=>{const k=e.dataset.st;if(k in st){e.hidden=false;e.classList.toggle('off',!st[k])}});
  const p=P(S.page);
  const crumb=$('#crumb');crumb.style.setProperty('--a',p.accent);
  crumb.innerHTML=`<i></i>${p.group?`<span>${p.group}</span><span>/</span>`:''}<b>${p.label}</b>`;
  const t=$(`[data-tab="${S.page}"]`);
  if(t){const w=$('#tabsWrap');const l=t.offsetLeft-24;if(l<w.scrollLeft||t.offsetLeft+t.offsetWidth>w.scrollLeft+w.clientWidth)w.scrollTo({left:Math.max(0,l),behavior:reduced?'auto':'smooth'})}
}
function renderStatus(){
  $('#status').innerHTML=
   `<span class="sb"><i class="dot-good"></i><b>${devicesOnline()}</b> of 3 devices connected</span>
    <span class="sb">${ic('mouse')}Cursor on <b data-live="active">${S.active}</b></span>
    <span class="sb">${ic('clipboard')}Clipboard <b>${S.clip?'on':'off'}</b></span>
    <span class="sb">${ic(LINKS[S.link].icon)}MacBook · ${linkLabel()} · <b class="num" data-live="ping">${S.ping}</b> ms</span>
    <span class="sb right" title="End-to-end encrypted">${ic('lock')}Encrypted</span>`;
}

/* ---------- folders: mount / re-render ---------- */
function front(){return $('#stack .sheet.front')}
function mount(id){
  const stack=$('#stack');
  const old=front();
  S.page=id;
  const p=P(id);
  const s=document.createElement('section');
  s.className='sheet front'+(old&&!reduced?' enter':'');
  s.style.setProperty('--a',p.accent);
  s.setAttribute('aria-labelledby','h-'+id);
  s.innerHTML=R[id]();
  s.addEventListener('animationend',e=>{if(e.target===s)s.classList.remove('enter')});
  $$('.sheet.back2',stack).forEach(e=>e.remove());
  $$('.sheet.back',stack).forEach(e=>e.classList.add('back2'));
  if(old){
    old.classList.remove('front','enter');old.classList.add('back');
    old.setAttribute('aria-hidden','true');old.inert=true;old.removeAttribute('aria-labelledby');
    $$('[id]',old).forEach(e=>e.removeAttribute('id'));
    setTimeout(()=>{if(!old.classList.contains('front'))old.innerHTML=''},reduced?0:420);
  }
  stack.appendChild(s);
  after(id);
  navState();renderStatus();
  $('#main').scrollTop=0;
}
function rerender(){
  const f=front(); if(!f) return;
  const key=focusKey(document.activeElement);
  f.innerHTML=R[S.page]();
  after(S.page);
  renderStatus(); navState();
  if(key){const el=$(key,f);if(el)el.focus({preventScroll:true})}
}
function focusKey(el){
  if(!el||!el.closest||!el.closest('.sheet.front'))return null;
  for(const a of ['data-act','data-ch','data-in']){if(el.hasAttribute(a)){let k=`[${a}="${el.getAttribute(a)}"]`;if(el.hasAttribute('data-v'))k+=`[data-v="${CSS.escape(el.getAttribute('data-v'))}"]`;return k}}
  return null;
}
function after(id){
  if(id==='layout') layoutView();
  if(id==='mouse') drawCursor();
}
function go(id){
  if(!P(id)) id='home';
  closeDrawer();
  if(id===S.page&&front()){rerender();return}
  mount(id);
}

/* ---------- live ticks ---------- */
function updateLive(){
  $$('[data-live=ping]').forEach(e=>e.textContent=S.ping);
  $$('[data-live=batt]').forEach(e=>e.textContent=S.batt);
  $$('[data-live=battbar]').forEach(e=>e.style.width=Math.round(S.batt*0.2)+'px');
  $$('[data-live=active]').forEach(e=>e.textContent=S.active);
  $$('[data-live=lat]').forEach(e=>e.textContent=S.lat);
  const p=S.pair;
  if(p.code){
    $$('[data-live=pairleft]').forEach(e=>e.textContent=Math.floor(p.left/60)+':'+String(p.left%60).padStart(2,'0'));
    $$('[data-live=pairring]').forEach(e=>e.setAttribute('stroke-dashoffset',(138.2*(1-p.left/120)).toFixed(1)));
  }
}
function tickPing(){
  S.ping=S.link==='wifi'?rnd(3,7):S.link==='usb'?(Math.random()<.75?1:2):rnd(9,15);
  S.lat=latBase()+Math.round((S.ss.quality-50)/8)+rnd(-3,3);
  updateLive();
}
setInterval(tickPing,1500);
setInterval(()=>{S.batt=Math.max(5,S.batt-1);updateLive()},24000);
setInterval(()=>{
  const p=S.pair;if(!p.code)return;
  p.left--; if(p.left<=0){newCode();if(S.page==='connection')rerender();toast('New pairing code');return}
  updateLive();
},1000);
function newCode(){S.pair.code=String(rnd(0,999999)).padStart(6,'0');S.pair.left=120}

/* ---------- the mouse header: cursor crossing at the outer edge ---------- */
const SC=2560/230;
const vy=y=>Math.round((y-20)*SC);
function path(){
  const start=[{x:90,y:95,d:0},{x:200,y:70,d:1400},{x:300,y:84,d:1500,ev:'internal'},{x:412,y:92,d:1300}];
  if(S.mouse&&!S.locked) return start.concat([
    {x:428,y:92,d:110,ev:'cross'},{x:500,y:70,d:1500},{x:540,y:108,d:1400},{x:470,y:116,d:1300},{x:428,y:84,d:1300},
    {x:411,y:84,d:110,ev:'back'},{x:330,y:110,d:1500},{x:150,y:120,d:1600},{x:90,y:95,d:1200}]);
  return start.concat([{x:412,y:92,d:500,ev:'blocked'},{x:370,y:104,d:700},{x:200,y:120,d:1600},{x:90,y:95,d:1200}]);
}
const sim={wp:null,i:0,t0:0,x:330,y:85};
function fire(ev,y){
  const t=clock();
  if(ev==='internal') addLog(`${t} no-cross reason=not-outer-edge edge=right pos=(2559,${vy(y)}) monitors=[0,0,2560x1440][2560,180,1920x1080]`);
  if(ev==='cross'){S.active='MacBook';addLog(`${t} cross ok edge=right pos=(4479,${vy(y)}) to=MacBook cooldown=${S.cooldown}ms`)}
  if(ev==='back'){S.active='Windows PC';addLog(`${t} cross ok edge=left from=MacBook to=Windows PC guard=${S.guard}ms`)}
  if(ev==='blocked') addLog(`${t} no-cross reason=${S.locked?'cursor-locked hotkey='+S.hotkey.replace(/ /g,''):'sharing-off'} edge=right pos=(4479,${vy(y)})`);
  if(ev==='cross'||ev==='back'){updateLive();const m=$('[data-macscr]');if(m)m.classList.toggle('on',S.active==='MacBook')}
}
function addLog(l){S.log.push(l);if(S.log.length>7)S.log.shift();const el=$('.sheet.front [data-live=log]');if(el){el.innerHTML=logHtml();el.scrollTop=el.scrollHeight}}
function drawCursor(){
  const g=$('.sheet.front [data-cursor]');if(g)g.setAttribute('transform',`translate(${sim.x.toFixed(1)} ${sim.y.toFixed(1)})`);
}
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
function frame(now){
  if(reduced){requestAnimationFrame(frame);return}
  if(!sim.wp){sim.wp=path();sim.i=0;sim.t0=now}
  const a=sim.wp[sim.i],b=sim.wp[sim.i+1];
  const p=Math.max(0,Math.min(1,(now-sim.t0)/b.d));
  const e=ease(p);
  sim.x=a.x+(b.x-a.x)*e; sim.y=a.y+(b.y-a.y)*e;
  if(p>=1){
    if(b.ev) fire(b.ev,b.y);
    sim.i++; sim.t0=now+(b.d>200?250:0);
    if(sim.i>=sim.wp.length-1){sim.wp=path();sim.i=0;if(S.active!=='Windows PC'){S.active='Windows PC';updateLive()}}
  }
  drawCursor();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
function resetSim(){sim.wp=null;if(S.active!=='Windows PC'){S.active='Windows PC'}}

/* ---------- screen layout: drag + snap ---------- */
const W={ox:2600,oy:1500,w:9600,h:4600};
const PCB={w:4480,h:1440}, MACB={w:1512,h:982};
function rectOf(id){const p=S.lay[id],b=id==='pc'?PCB:MACB;return {x:p.x,y:p.y,w:b.w,h:b.h}}
function monitors(){const p=S.lay.pc;return [{n:'Monitor 1',x:p.x,y:p.y,w:2560,h:1440},{n:'Monitor 2',x:p.x+2560,y:p.y+180,w:1920,h:1080}]}
function snap(id){
  const other=id==='pc'?'mac':'pc';
  const D=rectOf(id),B=rectOf(other),m=200;
  const cl=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
  const c=[
    {x:B.x+B.w,y:cl(D.y,B.y-D.h+m,B.y+B.h-m)},
    {x:B.x-D.w,y:cl(D.y,B.y-D.h+m,B.y+B.h-m)},
    {x:cl(D.x,B.x-D.w+m,B.x+B.w-m),y:B.y+B.h},
    {x:cl(D.x,B.x-D.w+m,B.x+B.w-m),y:B.y-D.h}
  ];
  let best=c[0],bd=Infinity;
  c.forEach(p=>{const d=Math.hypot(p.x-D.x,p.y-D.y);if(d<bd){bd=d;best=p}});
  S.lay[id]={x:Math.round(best.x),y:Math.round(best.y)};
}
function placeMac(side){
  const B=rectOf('pc'),D=MACB;
  const pos={right:{x:B.x+B.w,y:B.y+260},left:{x:B.x-D.w,y:B.y+230},above:{x:B.x+520,y:B.y-D.h},below:{x:B.x+520,y:B.y+B.h}}[side];
  S.lay.mac=pos; layoutView(); toast('MacBook placed '+(side==='above'||side==='below'?side:'to the '+side));
}
function edges(){
  const M=rectOf('mac'),out=[];
  const ov=(a1,a2,b1,b2)=>Math.min(a2,b2)-Math.max(a1,b1);
  monitors().forEach(mo=>{
    if(Math.abs(mo.x+mo.w-M.x)<1){const o=ov(mo.y,mo.y+mo.h,M.y,M.y+M.h);if(o>0)out.push({t:`${mo.n} right edge → MacBook left edge`,len:o,x:M.x,y:Math.max(mo.y,M.y),v:true})}
    if(Math.abs(M.x+M.w-mo.x)<1){const o=ov(mo.y,mo.y+mo.h,M.y,M.y+M.h);if(o>0)out.push({t:`${mo.n} left edge → MacBook right edge`,len:o,x:mo.x,y:Math.max(mo.y,M.y),v:true})}
    if(Math.abs(mo.y+mo.h-M.y)<1){const o=ov(mo.x,mo.x+mo.w,M.x,M.x+M.w);if(o>0)out.push({t:`${mo.n} bottom edge → MacBook top edge`,len:o,x:Math.max(mo.x,M.x),y:M.y,v:false})}
    if(Math.abs(M.y+M.h-mo.y)<1){const o=ov(mo.x,mo.x+mo.w,M.x,M.x+M.w);if(o>0)out.push({t:`${mo.n} top edge → MacBook bottom edge`,len:o,x:Math.max(mo.x,M.x),y:mo.y,v:false})}
  });
  return out;
}
const pctX=x=>((x+W.ox)/W.w*100).toFixed(3)+'%', pctY=y=>((y+W.oy)/W.h*100).toFixed(3)+'%';
function layoutView(){
  const lay=$('.sheet.front [data-lay]');if(!lay)return;
  ['pc','mac'].forEach(id=>{const r=rectOf(id),t=$(`[data-tile="${id}"]`,lay);if(!t)return;t.style.left=pctX(r.x);t.style.top=pctY(r.y);t.style.width=(r.w/W.w*100).toFixed(3)+'%';t.style.height=(r.h/W.h*100).toFixed(3)+'%'});
  $$('.edgeline',lay).forEach(e=>e.remove());
  const es=edges();
  es.forEach(e=>{const d=document.createElement('div');d.className='edgeline';
    d.style.left=pctX(e.x);d.style.top=pctY(e.y);
    if(e.v){d.style.width='3px';d.style.marginLeft='-1.5px';d.style.height=(e.len/W.h*100).toFixed(3)+'%'}
    else{d.style.height='3px';d.style.marginTop='-1.5px';d.style.width=(e.len/W.w*100).toFixed(3)+'%'}
    lay.appendChild(d)});
  const list=$('.sheet.front [data-live=edges]');
  if(list) list.innerHTML=es.length?es.map(e=>`<li>${e.t} <span class="muted num">· ${Math.round(e.len)} px shared</span></li>`).join(''):'<li class="none">No shared edge: the MacBook sits beside a gap. Slide it until it touches a screen.</li>';
  $$('.sheet.front [data-live=edgecount]').forEach(e=>e.textContent=es.length);
}
let drag=null;
document.addEventListener('pointerdown',e=>{
  const t=e.target.closest('.sheet.front .tile');if(!t)return;
  const lay=t.closest('[data-lay]');const id=t.dataset.tile;
  drag={id,t,lay,sx:e.clientX,sy:e.clientY,ox:S.lay[id].x,oy:S.lay[id].y,rect:lay.getBoundingClientRect()};
  t.classList.add('drag');t.setPointerCapture(e.pointerId);e.preventDefault();
});
document.addEventListener('pointermove',e=>{
  if(!drag)return;
  const dx=(e.clientX-drag.sx)/drag.rect.width*W.w, dy=(e.clientY-drag.sy)/drag.rect.height*W.h;
  const b=drag.id==='pc'?PCB:MACB;
  S.lay[drag.id]={x:Math.max(-W.ox,Math.min(W.w-W.ox-b.w,drag.ox+dx)),y:Math.max(-W.oy,Math.min(W.h-W.oy-b.h,drag.oy+dy))};
  drag.t.style.left=pctX(S.lay[drag.id].x);drag.t.style.top=pctY(S.lay[drag.id].y);
});
function endDrag(){
  if(!drag)return;const d=drag;drag=null;d.t.classList.remove('drag');
  snap(d.id);layoutView();
  const n=edges().length;toast(n?'Snapped · cursor crosses here':'Snapped · no shared edge yet');
}
document.addEventListener('pointerup',endDrag);
document.addEventListener('pointercancel',endDrag);

/* ---------- command bar ---------- */
function commands(){
  const L=[];
  const goTo=id=>()=>{location.hash=id;if(S.page===id)go(id)};
  L.push({t:S.clip?'Turn off clipboard':'Turn on clipboard',k:'clipboard copy paste share',a:'var(--c-clip)',i:'clipboard',run(){S.clip=!S.clip;return S.clip?'Clipboard is on':'Clipboard is off'}});
  L.push({t:S.mouse?'Turn mouse sharing off':'Turn mouse sharing on',k:'mouse keyboard share cursor',a:'var(--c-mouse)',i:'mouse',run(){S.mouse=!S.mouse;resetSim();return S.mouse?'Mouse sharing is on':'Mouse sharing is off'}});
  L.push({t:S.locked?'Unlock cursor':'Lock cursor to this screen',k:'lock cursor hotkey',a:'var(--c-mouse)',i:'lock',run(){S.locked=!S.locked;resetSim();return S.locked?'Cursor locked to this screen':'Cursor unlocked'}});
  if(S.ss.on!=='mac')L.push({t:'Start second screen on MacBook',k:'display monitor extend',a:'var(--c-screen)',i:'screen',run(){S.ss.on='mac';goTo('screen')();return 'Second screen is on the MacBook'}});
  if(S.ss.on!=='pc')L.push({t:'Use Windows PC as a screen for MacBook',k:'second screen display',a:'var(--c-screen)',i:'screen',run(){S.ss.on='pc';goTo('screen')();return 'Windows PC is now a screen for MacBook'}});
  if(S.ss.on)L.push({t:'Stop second screen',k:'display off',a:'var(--c-screen)',i:'power',run(){S.ss.on=null;return 'Second screen stopped'}});
  L.push({t:S.cam.on?'Stop sharing my camera':'Share my camera',k:'camera webcam video',a:'var(--c-cam)',i:'camera',run(){S.cam.on=!S.cam.on;if(S.cam.on)S.mode='multi';return S.cam.on?`Camera is live on ${S.cam.live}`:'Camera sharing is off'}});
  L.push({t:'Pair a new device',k:'add code connect join',a:'var(--c-conn)',i:'connection',run(){newCode();goTo('connection')();return 'Pairing code ready'}});
  ['wifi','usb','bt'].filter(k=>k!==S.link).forEach(k=>L.push({t:`Switch MacBook link to ${LINKS[k].label}`,k:'link connection cable',a:'var(--c-conn)',i:LINKS[k].icon,run(){S.link=k;tickPing();return `MacBook link: ${LINKS[k].label}`}}));
  L.push({t:S.mode==='multi'?'Switch to two-device mode':'Turn on Multi-device mode',k:'multi device mode',a:'var(--c-multi)',i:'devices',run(){S.mode=S.mode==='multi'?'two':'multi';return S.mode==='multi'?'Multi-device is on':'Two-device mode'}});
  PAGES.forEach(p=>L.push({t:'Go to '+p.label,k:'page open '+p.tab,a:p.accent,i:p.icon,nav:true,run(){goTo(p.id)();return null}}));
  return L;
}
function fuzzy(q,s){
  q=q.toLowerCase().replace(/\s+/g,'');if(!q)return {score:0,idx:[]};
  const t=s.toLowerCase();let i=0,score=0,last=-2;const idx=[];
  for(let j=0;j<t.length&&i<q.length;j++){if(t[j]===q[i]){idx.push(j);score+=(j===last+1?3:1)+((j===0||t[j-1]===' ')?2:0);last=j;i++}}
  return i===q.length?{score:score-t.length*.01,idx}:null;
}
let cmdItems=[],cmdSel=0,lastFocus=null,typingT=null;
function filterCmds(){
  const q=$('#cmdInput').value;
  cmdItems=commands().map(c=>{const r=fuzzy(q,c.t+' '+c.k);return r?Object.assign({},c,{score:r.score,idx:r.idx.filter(i=>i<c.t.length)}):null}).filter(Boolean);
  if(q.trim())cmdItems.sort((a,b)=>b.score-a.score);
  cmdSel=Math.min(cmdSel,Math.max(0,cmdItems.length-1));
  drawCmds();
}
function hl(t,idx){const set=new Set(idx);let o='';for(let i=0;i<t.length;i++){o+=set.has(i)?`<mark>${esc(t[i])}</mark>`:esc(t[i])}return o}
function drawCmds(){
  const ul=$('#cmdList');
  if(!cmdItems.length){ul.innerHTML='<li class="empty" role="presentation">No command matches. Try “clip”, “screen” or “go”.</li>';$('#cmdInput').removeAttribute('aria-activedescendant');return}
  ul.innerHTML=cmdItems.map((c,i)=>`<li id="cmd-${i}" role="option" aria-selected="${i===cmdSel}" data-i="${i}" style="--a:${c.a}"><span class="ci">${ic(c.i)}</span><span class="t">${hl(c.t,c.idx)}</span><span class="k">${c.nav?'Page':'Action'}</span></li>`).join('');
  $('#cmdInput').setAttribute('aria-activedescendant','cmd-'+cmdSel);
  const s=$('#cmd-'+cmdSel);if(s)s.scrollIntoView({block:'nearest'});
}
function openCmd(){
  const sc=$('#cmdScrim');if(!sc.hidden)return;
  lastFocus=document.activeElement;
  sc.hidden=false;$('#cmdInput').value='';cmdSel=0;filterCmds();
  requestAnimationFrame(()=>requestAnimationFrame(()=>sc.classList.add('open')));
  $('#cmdInput').focus();
}
function closeCmd(restore){
  const sc=$('#cmdScrim');if(sc.hidden)return;
  sc.classList.remove('open');$('#cmd').classList.remove('typing');
  setTimeout(()=>{if(!sc.classList.contains('open'))sc.hidden=true},reduced?0:400);
  if(restore!==false&&lastFocus&&document.contains(lastFocus))lastFocus.focus();
}
function runCmd(i){
  const c=cmdItems[i];if(!c)return;
  closeCmd(!c.nav);
  const msg=c.run();
  rerender();
  if(msg)toast(msg);
}
$('#cmdInput').addEventListener('input',()=>{
  cmdSel=0;filterCmds();
  const box=$('#cmd');box.classList.add('typing');clearTimeout(typingT);typingT=setTimeout(()=>box.classList.remove('typing'),900);
});
$('#cmdInput').addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'){e.preventDefault();if(cmdItems.length){cmdSel=(cmdSel+1)%cmdItems.length;drawCmds()}}
  else if(e.key==='ArrowUp'){e.preventDefault();if(cmdItems.length){cmdSel=(cmdSel-1+cmdItems.length)%cmdItems.length;drawCmds()}}
  else if(e.key==='Enter'){e.preventDefault();runCmd(cmdSel)}
  else if(e.key==='Tab'){e.preventDefault()}
});
$('#cmdList').addEventListener('click',e=>{const li=e.target.closest('li[data-i]');if(li)runCmd(+li.dataset.i)});
$('#cmdScrim').addEventListener('mousedown',e=>{if(e.target.id==='cmdScrim')closeCmd()});

/* ---------- toast ---------- */
let toastT=null;
function toast(m){const t=$('#toast');$('span',t).textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2400)}

/* ---------- drawer ---------- */
function closeDrawer(){$('#app').classList.remove('drawer');$('#menuBtn').setAttribute('aria-expanded','false')}
function toggleDrawer(){const o=$('#app').classList.toggle('drawer');$('#menuBtn').setAttribute('aria-expanded',String(o));if(o){const a=$('.nav-i[aria-current]')||$('.nav-i');a&&a.focus()}}

/* ---------- actions ---------- */
const ACT={
  t(v){
    if(v==='clip'){S.clip=!S.clip;toast(S.clip?'Clipboard is on':'Clipboard is off')}
    if(v==='mouse'){S.mouse=!S.mouse;resetSim();toast(S.mouse?'Mouse sharing is on':'Mouse sharing is off')}
    if(v==='locked'){S.locked=!S.locked;resetSim();toast(S.locked?'Cursor locked to this screen':'Cursor unlocked')}
    if(v==='cam'){S.cam.on=!S.cam.on;toast(S.cam.on?`Camera is live on ${S.cam.live}`:'Camera sharing is off')}
    rerender();
  },
  link(v){S.link=v;tickPing();rerender();toast('MacBook link: '+LINKS[v].label)},
  pairNew(){newCode();rerender();toast('Pairing code ready')},
  pairGo(){newCode()},
  pairCancel(){S.pair.code=null;rerender();toast('Pairing cancelled')},
  ssStart(v){S.ss.on=v;tickPing();if(S.page!=='screen'){location.hash='screen'}else rerender();toast(v==='mac'?'Second screen is on the MacBook':'Windows PC is now a screen for MacBook')},
  ssStop(){S.ss.on=null;rerender();toast('Second screen stopped')},
  res(v){S.ss.res=v;rerender();toast('Resolution '+v)},
  clipDir(v){S.clipDir=v;rerender()},
  clipMax(v){S.clipMax=v;rerender();toast('Files up to '+v)},
  camLive(v){S.cam.live=v;rerender();toast(S.cam.on?`Camera is live on ${v}`:`${v} camera selected`)},
  mode(v){S.mode=v;rerender();toast(v==='multi'?'Multi-device is on':'Two-device mode')},
  place(v){placeMac(v)},
  hk(){S.hkRec=!S.hkRec;rerender()},
  tipAmt(v){S.tip.amt=+v;S.tip.custom='';rerender()},
  tipGo(){S.tip.done=true;rerender();toast('Thank you!')},
  tipReset(){S.tip.done=false;rerender()},
  fbType(v){S.fb.type=v;rerender()},
  fbSend(){if(!S.fb.msg.trim()){S.fb.err=true;rerender();const t=$('.sheet.front #fbmsg');t&&t.focus();return}S.fb.err=false;S.fb.sent=true;rerender();toast('Feedback sent (preview)')},
  fbReset(){S.fb={type:'Idea',msg:'',sys:false,sent:false,err:false};rerender()},
  cmd(){openCmd()},
  drawer(){toggleDrawer()}
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act;if(!ACT[a])return;
  if(el.tagName==='A'&&a==='pairGo'){ACT.pairGo();return}
  e.preventDefault();ACT[a](el.dataset.v);
});
document.addEventListener('input',e=>{
  const k=e.target.dataset&&e.target.dataset.in;if(!k)return;const v=e.target.value;
  if(k==='cooldown'||k==='guard'){S[k]=+v;$$(`[data-out="${k}"]`).forEach(o=>o.textContent=v)}
  if(k==='quality'){S.ss.quality=+v;tickPing()}
  if(k==='tipc'){S.tip.custom=v.replace(/[^0-9.]/g,'');$$('[data-out=tipbtn]').forEach(o=>o.textContent=`Leave a $${tipAmount()} tip`);$$('.amts button').forEach(b=>b.setAttribute('aria-pressed',String(!S.tip.custom&&S.tip.amt===+b.dataset.v)))}
  if(k==='fbmsg'){S.fb.msg=v;if(S.fb.err&&v.trim()){S.fb.err=false;const er=$('.sheet.front .err');er&&er.remove()}}
});
document.addEventListener('change',e=>{
  if(e.target.dataset&&e.target.dataset.ch==='fbsys'){S.fb.sys=e.target.checked;rerender()}
});
document.addEventListener('keydown',e=>{
  if(S.hkRec){
    e.preventDefault();
    if(e.key==='Escape'){S.hkRec=false;rerender();return}
    if(['Control','Alt','Shift','Meta'].includes(e.key))return;
    const combo=[e.ctrlKey&&'Ctrl',e.altKey&&(isMac?'Option':'Alt'),e.shiftKey&&'Shift',e.metaKey&&(isMac?'Cmd':'Win')].filter(Boolean);
    if(!combo.length){toast('Add Ctrl, Alt or Shift to the key');return}
    combo.push(e.key.length===1?e.key.toUpperCase():e.key);
    S.hotkey=combo.join(' + ');S.hkRec=false;rerender();toast('Lock hotkey: '+S.hotkey);return;
  }
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();const sc=$('#cmdScrim');sc.hidden?openCmd():closeCmd();return}
  if(e.key==='Escape'){if(!$('#cmdScrim').hidden){e.preventDefault();closeCmd();return}if($('#app').classList.contains('drawer')){closeDrawer();$('#menuBtn').focus()}return}
  const tile=e.target.closest&&e.target.closest('.sheet.front .tile');
  if(tile&&e.key.startsWith('Arrow')){e.preventDefault();placeMac({ArrowRight:'right',ArrowLeft:'left',ArrowUp:'above',ArrowDown:'below'}[e.key])}
});
window.addEventListener('hashchange',()=>go(location.hash.slice(1)));
RM.addEventListener&&RM.addEventListener('change',e=>{reduced=e.matches;if(reduced){S.active='Windows PC';sim.x=330;sim.y=85;drawCursor();updateLive()}});

/* ---------- boot ---------- */
$('#kbdHint').textContent=isMac?'⌘K':'Ctrl K';
buildNav();
(function seedStack(){
  const st=$('#stack');
  [['var(--c-clip)','back back2'],['var(--c-conn)','back']].forEach(x=>{const s=document.createElement('section');s.className='sheet '+x[1];s.style.setProperty('--a',x[0]);s.setAttribute('aria-hidden','true');s.inert=true;st.appendChild(s)});
})();
const first=location.hash.slice(1);
mount(P(first)?first:'home');
renderStatus();
if(reduced){S.active='Windows PC'}
})();
</script>
